# The servers and database, ready to run:
#
#   cd build/docker
#   cp .env.example .env        # fill in the four required values
#   docker compose up -d --build
#
# Signaling is published on 127.0.0.1 only so it is not reachable in plaintext from the network. For a public server,
# put the Caddy overlay in front (it obtains and renews the certificate):
#
#   RENDEZVOUS_DOMAIN=rd.example.com docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# A plaintext LAN-only deployment is an explicit choice — bind signaling to every interface instead:
#
#   RENDEZVOUS_BIND_IP=0.0.0.0 docker compose up -d --build
#
# and have clients use ws://<server>:5080/ws. The internal management API stays protected by NODE_TOKEN either way.
#
# The monitoring console is optional; docker-compose.ops.yml adds it. See docs/ops/README.md, "用 Docker 部署（Linux 服务器首选）".
#
# Device codes are stored persistently in PostgreSQL (volume postgres-data), so unattended access keeps its device
# IDs across restarts and upgrades.
#
# A single server does not need PostgreSQL: set Rendezvous__Database__Provider=sqlite and
# Rendezvous__Database__Path=/data/rendezvous.db, mount a volume at /data, and remove the postgres service, the
# database environment values and the depends_on entry below. The image creates /data with the server's UID, so a
# fresh named volume is writable. Two rendezvous containers on SQLite would each hand out their own device ids.
#
# Required values (generate the secrets; .env.example leaves them empty so that a missing one stops compose):
#   POSTGRES_PASSWORD       openssl rand -base64 24
#   RELAY_SHARED_KEY        openssl rand -base64 48
#   RELAY_PUBLIC_ENDPOINT   the ADDRESS clients are told to relay through, e.g. 203.0.113.10:5082 (not a name)
#   NODE_TOKEN              openssl rand -base64 32; shared by signaling, relay and the console
name: remotedesktop

# A local build is not a release, so the image tags default to "dev" rather than to a product version that would go
# stale the moment Directory.Build.props changes. Set it when the image has to be identifiable later:
#   export REMOTEDESKTOP_VERSION=1.0.0
# The version compiled into the assemblies always comes from Directory.Build.props; this only names the image.

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: remotedesktop
      POSTGRES_USER: remotedesktop
      # Required, with no default: a database password that is written down in the repository is not a password.
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, for example: export POSTGRES_PASSWORD="$(openssl rand -base64 24)"}'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remotedesktop -d remotedesktop"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  rendezvous:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile.rendezvous
      args:
        VERSION: ${REMOTEDESKTOP_VERSION:-dev}
    image: remotedesktop/rendezvous:${REMOTEDESKTOP_VERSION:-dev}
    environment:
      # The listener has to be reachable from outside the container (the published port, Caddy and the ops console all
      # arrive over the container network), so it cannot keep the loopback default. Plain HTTP on a non-loopback address
      # needs the explicit opt-in below. That is safe here only because exposure is decided by `ports:` — loopback on
      # the host unless RENDEZVOUS_BIND_IP says otherwise — so put TLS in front (docker-compose.tls.yml or
      # docker-compose.selfsigned.yml) before publishing it beyond a trusted network.
      Urls: http://0.0.0.0:5080
      Rendezvous__AllowInsecureSignaling: "true"
      # The address handed to clients for relayed connections. It must be reachable by the clients, so 127.0.0.1
      # only works when everything runs on the same machine.
      Rendezvous__RelayEndpoint: ${RELAY_PUBLIC_ENDPOINT:?set RELAY_PUBLIC_ENDPOINT, for example 203.0.113.10:5082}
      Rendezvous__RelaySharedKey: ${RELAY_SHARED_KEY:?set RELAY_SHARED_KEY, for example openssl rand -base64 48}
      Rendezvous__ReflectorPort: 5081
      # The internal management API shares this listener. An empty token now means "loopback callers only", but a
      # required one keeps the console usable from another container and is what the console and relay use too.
      Rendezvous__NodeToken: ${NODE_TOKEN:?set NODE_TOKEN, for example openssl rand -base64 32}
      # The reverse proxies allowed to set X-Forwarded-For. 172.16.0.0/12 covers Docker's default bridge networks,
      # but it is broad: if the LAN also uses that range, narrow it to the proxy's address or the compose network.
      # Set RENDEZVOUS_TRUSTED_PROXIES when the daemon uses a different address pool.
      Rendezvous__TrustedProxies__0: ${RENDEZVOUS_TRUSTED_PROXIES:-172.16.0.0/12}
      Rendezvous__Database__Provider: postgres
      Rendezvous__Database__ConnectionString: "Host=postgres;Port=5432;Database=remotedesktop;Username=remotedesktop;Password=${POSTGRES_PASSWORD}"
    ports:
      # Loopback by default: use docker-compose.tls.yml for public TLS, or set RENDEZVOUS_BIND_IP=0.0.0.0 for a
      # plaintext LAN deployment.
      - "${RENDEZVOUS_BIND_IP:-127.0.0.1}:5080:5080/tcp"
      - "5081:5081/udp"   # address reflection: tells each side what the other sees
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # A liveness probe: the runtime image has no curl, so this only checks that the port answers. Whether the
      # service can actually do its work — the database included — is what /health reports, for your own monitoring.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/5080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # The image already runs as a non-root user; this takes away the ways back up from it.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M

  relay:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile.relay
      args:
        VERSION: ${REMOTEDESKTOP_VERSION:-dev}
    image: remotedesktop/relay:${REMOTEDESKTOP_VERSION:-dev}
    environment:
      Relay__Port: 5082
      Relay__SharedKey: ${RELAY_SHARED_KEY:?set RELAY_SHARED_KEY, for example openssl rand -base64 48}
      Relay__NodeToken: ${NODE_TOKEN:?set NODE_TOKEN, for example openssl rand -base64 32}
    ports:
      - "5082:5082/udp"
    restart: unless-stopped
    healthcheck:
      # The HTTP face is loopback-only inside the container; this is also the endpoint the ops console scrapes.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/5083' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data:

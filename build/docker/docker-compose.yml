# The servers and database, ready to run:
#
#   cd build/docker
#   export RELAY_SHARED_KEY="$(openssl rand -base64 48)"       # PowerShell: $env:RELAY_SHARED_KEY = ...
#   export RELAY_PUBLIC_ENDPOINT="203.0.113.10:5082"           # the ADDRESS clients will be told to relay through (not a name)
#   export POSTGRES_PASSWORD="$(openssl rand -base64 24)"      # required: there is no default password
#   docker compose up -d --build
#
# Device codes are stored persistently in PostgreSQL (volume postgres-data):
# they survive restarts and upgrades, ensuring unattended access never loses its target device IDs.
name: remotedesktop

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: remotedesktop
      POSTGRES_USER: remotedesktop
      # Required, with no default: a database password that is written down in the repository is not a password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, for example: export POSTGRES_PASSWORD="$(openssl rand -base64 24)"}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remotedesktop -d remotedesktop"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  rendezvous:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile.rendezvous
    image: remotedesktop/rendezvous:0.3.0
    environment:
      # The address handed to clients for relayed connections. It must be reachable by the clients, so 127.0.0.1
      # only works when everything runs on the same machine.
      Rendezvous__RelayEndpoint: ${RELAY_PUBLIC_ENDPOINT:-127.0.0.1:5082}
      Rendezvous__RelaySharedKey: ${RELAY_SHARED_KEY:-}
      Rendezvous__ReflectorPort: 5081
      Rendezvous__PostgresConnectionString: Host=postgres;Port=5432;Database=remotedesktop;Username=remotedesktop;Password=${POSTGRES_PASSWORD}
    ports:
      - "5080:5080/tcp"   # signaling: clients connect here (WebSocket /ws, health /health)
      - "5081:5081/udp"   # address reflection: tells each side what the other sees
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # A liveness probe: the runtime image has no curl, so this only checks that the port answers. Whether the
      # service can actually do its work — the database included — is what /health reports, for your own monitoring.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/5080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # The image already runs as a non-root user; this takes away the ways back up from it.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  relay:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile.relay
    image: remotedesktop/relay:0.3.0
    environment:
      Relay__Port: 5082
      Relay__SharedKey: ${RELAY_SHARED_KEY:-}
    ports:
      - "5082:5082/udp"
    restart: unless-stopped
    depends_on:
      - rendezvous
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data:

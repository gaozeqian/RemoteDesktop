name: Verify the packages hold what they are supposed to
description: >-
  Opens every installer this platform just built and checks what is inside it, instead of counting files: the Linux
  branch lists the .deb contents with dpkg-deb and reads the dependency lines its control file has to carry, the macOS
  branch lists the .pkg payload with pkgutil, and the Windows branch reads the MSI database through the repository's
  own installer package tests. Every branch also compares the version the package declares with
  Directory.Build.props, so a stale package or a 0.0.0 fallback fails here. Shared by ci.yml and release.yml and by
  all three platforms, so that the same claim is made about every package in the same way. Every one of these build
  scripts can exit zero without having produced something usable, and a package that installs nothing is still a
  package.

runs:
  using: composite
  steps:
    - name: Verify the .deb packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -eu

        # One version source. Reading it here, through the same helper the packagers use, is what turns "the package
        # was built" into "the package was built from this checkout" — a stale .deb or a 0.0.0 fallback otherwise
        # passes every check below, because both are perfectly valid package contents.
        . build/installer/version.sh
        expected=$(read_product_version "$PWD")

        count=$(ls -1 artifacts/installer/linux/*.deb 2>/dev/null | wc -l)
        if [ "$count" -ne 3 ]; then
          echo "Expected three packages, found $count:" >&2
          ls -la artifacts/installer/linux/ >&2 || true
          exit 1
        fi

        # The dependencies have to be written by hand — our libraries are reached through DllImport, which
        # dpkg-shlibdeps cannot see — so a control file that has lost them installs cleanly and then fails on first
        # use. Every package declares something, whether in Depends or in Recommends (the server's msquic is
        # optional, so it is a Recommends).
        check() {
          package=$1
          binary=$2

          # The declared version and the name have to agree with the checkout, not merely be well-formed. The
          # glob above deliberately accepts any version so that a package from an earlier build is visible here
          # rather than silently skipped; this is what rejects it.
          package_version=$(dpkg-deb --field "$package" Version)
          if [ "$package_version" != "$expected" ]; then
            echo "$package declares version $package_version, expected $expected." >&2
            exit 1
          fi

          case "$package" in
            *"-$expected.deb") ;;
            *)
              echo "$package is not named for version $expected." >&2
              exit 1
              ;;
          esac

          # The listing is read into a variable rather than piped into grep: grep stops at the first match and
          # closes the pipe, which leaves dpkg's tar writing into nothing and printing a broken-pipe error that
          # reads like a failure in a log that is otherwise green.
          contents=$(dpkg-deb --contents "$package")
          case "$contents" in
            *"$binary"*) ;;
            *)
              echo "$package does not contain $binary." >&2
              exit 1
              ;;
          esac

          declared=$(dpkg-deb --field "$package" Depends Recommends 2>/dev/null || true)
          if [ -z "$declared" ]; then
            echo "$package declares no dependencies or recommendations; the control file has probably lost them." >&2
            exit 1
          fi

          echo "--- $(dpkg-deb --field "$package" Package) $($(command -v stat) -c%s "$package") bytes"
          dpkg-deb --info "$package" | sed -n '1,10p'
        }

        check artifacts/installer/linux/RemoteDesktop-Client-Linux-amd64-*.deb RemoteDesktop.Client
        check artifacts/installer/linux/RemoteDesktop-Host-Linux-amd64-*.deb RemoteDesktop.HostService
        check artifacts/installer/linux/RemoteDesktop-Server-Linux-amd64-*.deb RemoteDesktop.Server.Rendezvous
        # The console is the third program in the server package. Checked separately so a server package that lost it
        # fails here rather than at the first operator who opens 5090.
        server=$(ls -1 artifacts/installer/linux/RemoteDesktop-Server-Linux-amd64-*.deb)
        case "$(dpkg-deb --contents "$server")" in
          *RemoteDesktop.Server.Ops*) ;;
          *)
            echo "$server does not contain the Ops console." >&2
            exit 1
            ;;
        esac

    - name: Verify the .pkg installers
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -eu

        # Same version source as the Linux branch and as the packagers themselves.
        . build/installer/version.sh
        expected=$(read_product_version "$PWD")

        count=$(ls -1 artifacts/installer/macos/*.pkg 2>/dev/null | wc -l)
        if [ "$count" -ne 3 ]; then
          echo "Expected three packages, found $count:" >&2
          ls -la artifacts/installer/macos/ >&2 || true
          exit 1
        fi

        # Every component package carries a version, and the product archive's pkg-ref is built from the same value.
        # A package left over from an earlier build, or one built before <Version> was readable, fails here.
        check_component_versions() {
          package=$1
          # pkgutil refuses a target that already exists ("Error 17: File exists" on macOS 26), and mktemp creates
          # one. Remove it first; the path is still unique and still cleaned up by the rm at the end.
          expanded=$(mktemp -d)
          rmdir "$expanded"
          pkgutil --expand "$package" "$expanded"
          components=0
          for component in "$expanded"/*.pkg; do
            [ -d "$component" ] || continue
            components=$((components + 1))
            # PackageInfo is a <pkg-info> document, not a <plist>; plutil refuses it with "unknown tag pkg-info"
            # (and did so on macOS 26 even though the check read as if it worked). The version is an attribute of
            # the root element.
            actual=$(sed -n 's/.*<pkg-info[^>]* version="\([^"]*\)".*/\1/p' "$component/PackageInfo" | head -1)
            if [ "$actual" != "$expected" ]; then
              echo "$package component $(basename "$component") declares version '$actual', expected $expected." >&2
              exit 1
            fi
          done
          if [ "$components" -eq 0 ]; then
            echo "$package has no component package whose version could be read." >&2
            exit 1
          fi
          rm -rf "$expanded"
        }

        # The bundle has its own version and the package receipt does not prove they agree. --expand-full exposes the
        # payload; if a package genuinely has no app, the caller does not use this.
        check_bundle_version() {
          package=$1
          expanded=$(mktemp -d)
          rmdir "$expanded"
          if ! pkgutil --expand-full "$package" "$expanded" >/dev/null 2>&1; then
            echo "$package could not be expanded to read the app bundle version." >&2
            exit 1
          fi
          info=$(find "$expanded" -path '*.app/Contents/Info.plist' -print | head -1)
          if [ -z "$info" ]; then
            echo "$package has no .app/Contents/Info.plist." >&2
            exit 1
          fi
          actual=$(/usr/bin/plutil -extract CFBundleShortVersionString raw "$info" 2>/dev/null || true)
          if [ "$actual" != "$expected" ]; then
            echo "$package bundle declares CFBundleShortVersionString '$actual', expected $expected." >&2
            exit 1
          fi
          actual=$(/usr/bin/plutil -extract CFBundleVersion raw "$info" 2>/dev/null || true)
          if [ "$actual" != "$expected" ]; then
            echo "$package bundle declares CFBundleVersion '$actual', expected $expected." >&2
            exit 1
          fi

          # A LAN deployment is the normal self-hosted shape. macOS 15+ refuses the connection with no prompt when
          # this key is missing, so its absence is a delivery defect the package tests have to see.
          usage=$(/usr/bin/plutil -extract NSLocalNetworkUsageDescription raw "$info" 2>/dev/null || true)
          if [ -z "$usage" ]; then
            echo "$package bundle has no NSLocalNetworkUsageDescription." >&2
            exit 1
          fi
          rm -rf "$expanded"
        }

        # The Installer pane travels as a gzip-compressed cpio in the product archive's PlugIns file; pkgutil --expand
        # leaves PlugIns as an empty directory. Read it with xar so a package that lost the pane (or was built with
        # the wrong role) fails here rather than in front of the first person who double-clicks it.
        check_plugin() {
          package=$1
          role=$2
          package_abs="$(cd "$(dirname "$package")" && pwd)/$(basename "$package")"
          expanded=$(mktemp -d)
          if ! ( cd "$expanded" && xar -xf "$package_abs" PlugIns ); then
            echo "$package has no PlugIns payload." >&2
            exit 1
          fi
          if ! ( cd "$expanded" && gunzip -c PlugIns | cpio -idm 2>/dev/null ); then
            echo "$package PlugIns payload could not be unpacked." >&2
            exit 1
          fi
          if [ ! -f "$expanded/RemoteDesktopSetup.bundle/Contents/Info.plist" ]; then
            echo "$package does not contain the installer pane." >&2
            exit 1
          fi
          if [ ! -f "$expanded/InstallerSections.plist" ]; then
            echo "$package does not contain InstallerSections.plist." >&2
            exit 1
          fi
          actual=$(/usr/bin/plutil -extract RDRole raw "$expanded/RemoteDesktopSetup.bundle/Contents/Info.plist" 2>/dev/null || true)
          if [ "$actual" != "$role" ]; then
            echo "$package installer pane has role '$actual', expected $role." >&2
            exit 1
          fi
          if ! codesign --verify --strict "$expanded/RemoteDesktopSetup.bundle" >/dev/null 2>&1; then
            echo "$package installer pane does not have a valid signature." >&2
            exit 1
          fi
          rm -rf "$expanded"
        }

        check_scripts() {
          package=$1
          component=$2
          shift 2
          expanded=$(mktemp -d)
          rmdir "$expanded"
          pkgutil --expand "$package" "$expanded"
          for script in "$@"; do
            if [ ! -f "$expanded/$component/Scripts/$script" ]; then
              echo "$package has no $component/Scripts/$script." >&2
              exit 1
            fi
          done
          rm -rf "$expanded"
        }

        # Same two questions as the .deb branch: is the program the package exists to install in there, and is the
        # thing that makes it run in there with it. On macOS that second part is the launchd job for each server and
        # the bundle's Info.plist for the client — a .pkg without them installs something that does nothing, and
        # pkgbuild would still have built it without a word.
        check() {
          package=$1
          shift

          check_component_versions "$package"

          payload=$(pkgutil --payload-files "$package")
          for wanted in "$@"; do
            case "$payload" in
              *"$wanted"*) ;;
              *)
                echo "$package does not contain $wanted." >&2
                exit 1
                ;;
            esac
          done

          echo "--- $(basename "$package") $($(command -v stat) -f%z "$package") bytes, $(printf '%s\n' "$payload" | wc -l | tr -d ' ') payload entries"
        }

        client=$(ls -1 artifacts/installer/macos/RemoteDesktop-Client-macOS-*.pkg)
        check "$client" \
          RemoteDesktop.Client 'Remote Desktop.app/Contents/Info.plist'
        check_bundle_version "$client"
        client_expanded=$(mktemp -d)
        rmdir "$client_expanded"
        pkgutil --expand "$client" "$client_expanded"
        client_bom="$(lsbom "$client_expanded/component.pkg/Bom")"
        for wanted in \
          'Remote Desktop.app/Contents/MacOS/RemoteDesktop.Client' \
          'Remote Desktop.app/Contents/MacOS/libmsquic.dylib' \
          'Remote Desktop.app/Contents/MacOS/libRemoteDesktopMacNative.dylib'; do
          case "$client_bom" in
            *"$wanted"*) ;;
            *)
              echo "$client does not contain $wanted." >&2
              exit 1
              ;;
          esac
        done
        rm -rf "$client_expanded"
        check_plugin "$client" client
        check_scripts "$client" component.pkg preinstall postinstall apply-answers.sh

        # The host package is a product archive with two components (the app and the login item). pkgutil
        # --payload-files shows only the first one, and it does not read an expanded component directory either, so
        # the archive is expanded and each component's BOM is read. Checking the product's payload list is what made
        # a correct two-package product look like it had lost the login item.
        host=$(ls -1 artifacts/installer/macos/RemoteDesktop-Host-macOS-*.pkg)
        check_component_versions "$host"
        host_expanded=$(mktemp -d)
        rmdir "$host_expanded"
        pkgutil --expand "$host" "$host_expanded"
        for component in app agent; do
          if [ ! -d "$host_expanded/$component.pkg" ]; then
            echo "$host has no $component component." >&2
            exit 1
          fi
        done
        host_bom="$(lsbom "$host_expanded/app.pkg/Bom")"
        for wanted in \
          'Remote Desktop Host.app/Contents/MacOS/RemoteDesktop.HostService' \
          'Remote Desktop Host.app/Contents/MacOS/libmsquic.dylib' \
          'Remote Desktop Host.app/Contents/MacOS/libRemoteDesktopMacNative.dylib'; do
          case "$host_bom" in
            *"$wanted"*) ;;
            *)
              echo "$host does not contain $wanted." >&2
              exit 1
              ;;
          esac
        done
        agent_bom="$(lsbom "$host_expanded/agent.pkg/Bom")"
        for wanted in 'LaunchAgents/com.remotedesktop.host.plist' 'uninstall-host.sh'; do
          case "$agent_bom" in
            *"$wanted"*) ;;
            *)
              echo "$host does not contain $wanted." >&2
              exit 1
              ;;
          esac
        done
        rm -rf "$host_expanded"
        check_bundle_version "$host"
        check_plugin "$host" host
        check_scripts "$host" agent.pkg preinstall postinstall apply-answers.sh
        echo "--- $(basename "$host") $($(command -v stat) -f%z "$host") bytes, app + login item"

        server=$(ls -1 artifacts/installer/macos/RemoteDesktop-Server-macOS-*.pkg)
        check "$server" \
          RemoteDesktop.Server.Rendezvous RemoteDesktop.Server.Relay RemoteDesktop.Server.Ops \
          com.remotedesktop.rendezvous.plist com.remotedesktop.relay.plist com.remotedesktop.ops.plist \
          configure-server.sh uninstall-server.sh how-to-configure.txt
        server_payload=$(pkgutil --payload-files "$server")
        case "$server_payload" in
          *appsettings.Development.json*)
            echo "$server carries a development settings file." >&2
            exit 1
            ;;
        esac
        check_plugin "$server" server
        check_scripts "$server" component.pkg preinstall postinstall

    - name: Verify the MSI installers
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $installerFolder = 'artifacts/installer/windows'

        # The build produces RemoteDesktop-Client-Windows-x64-<version>.msi, RemoteDesktop-Host-Windows-x64-<version>.msi
        # and RemoteDesktop-Server-Windows-x64-<version>.msi, all into the one folder because the role is already in the
        # file name — the same <产品>-<角色>-<平台>-<架构>-<版本> shape as the macOS and Linux packages. Three globs, one per
        # role, each matching its own prefix, so a stale package from another role is never picked up.
        $client = @(Get-ChildItem -Path "$installerFolder/RemoteDesktop-Client-Windows-x64-*.msi" -ErrorAction SilentlyContinue)
        $hostPackage = @(Get-ChildItem -Path "$installerFolder/RemoteDesktop-Host-Windows-x64-*.msi" -ErrorAction SilentlyContinue)
        $server = @(Get-ChildItem -Path "$installerFolder/RemoteDesktop-Server-Windows-x64-*.msi" -ErrorAction SilentlyContinue)

        # One glob must find exactly one package each. Two would mean a stale one from an earlier build is sitting
        # next to the fresh one, which is how a release ends up shipping the wrong bytes.
        if ($client.Count -ne 1) { throw "Expected one client installer in $installerFolder, found $($client.Count)." }
        if ($hostPackage.Count -ne 1) { throw "Expected one host installer in $installerFolder, found $($hostPackage.Count)." }
        if ($server.Count -ne 1) { throw "Expected one server installer in $installerFolder, found $($server.Count)." }

        # The same question as the other two branches — is the program in there, and what makes it run — answered by
        # opening the MSI database (no installation, no elevation). The assertions live in C# because they read half a
        # dozen tables: the payload, the service and its restart behaviour, the firewall rule, the shortcut, the
        # dialogs and the licence text. WiX 5 drops things without a word, and a package missing them builds,
        # installs, and quietly does nothing.
        #
        # The build scripts run these tests once themselves as part of building, so on Windows this is a second pass
        # over the same packages. That is deliberate: it is what makes this the same claim on all three platforms,
        # and it is the pass that verifies the package the release job has on disk rather than the one the build
        # script had in hand. InstallerPackageTests includes the assertion that the MSI's ProductVersion is the
        # product version plus the fourth .0.
        $checks = @(
          @{ Msi = $client[0].FullName;      Variable = 'RD_INSTALLER_MSI';        Class = 'RemoteDesktop.Platform.Windows.UnitTests.InstallerPackageTests' }
          @{ Msi = $hostPackage[0].FullName; Variable = 'RD_INSTALLER_MSI';        Class = 'RemoteDesktop.Platform.Windows.UnitTests.HostInstallerPackageTests' }
          @{ Msi = $server[0].FullName;      Variable = 'RD_SERVER_INSTALLER_MSI'; Class = 'RemoteDesktop.Platform.Windows.UnitTests.ServerInstallerPackageTests' }
        )

        foreach ($check in $checks) {
          Write-Host "--- $(Split-Path -Leaf $check.Msi) ($([math]::Round((Get-Item $check.Msi).Length / 1MB, 1)) MB)"
          Set-Item -Path "Env:$($check.Variable)" -Value $check.Msi
          # --results-directory is not optional. Without it dotnet test creates an empty TestResults/ in the current
          # directory, which puts a second artifact root back at the repository root -- the thing "构建产物布局" in
          # CONTRIBUTING.md says there is only one of. This branch is Windows-only, so the directory is fixed too.
          dotnet test --project tests/RemoteDesktop.Platform.Windows.UnitTests --filter-class $check.Class --results-directory artifacts/test-results/windows -v quiet
          if ($LASTEXITCODE -ne 0) { throw "$($check.Msi) is missing something (see the test output above)." }
          Remove-Item "Env:$($check.Variable)" -ErrorAction SilentlyContinue
        }

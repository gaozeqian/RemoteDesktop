name: Audit packages for known vulnerabilities
description: >-
  Walks the whole dependency graph, including everything the packages a project references drag in, and fails the build
  when any of them has a published vulnerability, or when the audit itself could not be completed (a vulnerability
  source that cannot be reached is not a clean result). Shared by ci.yml and release.yml so that the two cannot drift
  apart: a release is the one build nobody gets to re-check before it is public, so it has to apply exactly the rule CI
  applied. The build itself only reports what is wrong with the packages a project references directly.

runs:
  using: composite
  steps:
    - name: Audit
      shell: pwsh
      env:
        # The vulnerability check below reads the English wording of the report, so the CLI must not localise it.
        DOTNET_CLI_UI_LANGUAGE: en
      run: |
        $targets = @(
          'RemoteDesktop.slnx',
          'build/installer/windows/client/RemoteDesktop.Installer.wixproj',
          'build/installer/windows/server/RemoteDesktop.Server.Installer.wixproj',
          'build/installer/windows/client/CustomActions/RemoteDesktop.Client.Installer.CustomActions.csproj',
          'build/installer/windows/server/CustomActions/RemoteDesktop.Server.Installer.CustomActions.csproj'
        )
        foreach ($target in $targets) {
          Write-Host "Restoring and auditing $target"
          dotnet restore $target --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "Locked restore failed for $target." }
          $report = dotnet list $target package --vulnerable --include-transitive --no-restore
          $exitCode = $LASTEXITCODE
          $report
          if ($exitCode -ne 0) {
            throw "dotnet list package exited with code $exitCode for $target; the audit did not complete."
          }
          $text = $report -join "`n"
          # NU1900 means vulnerability data could not be fetched even though the CLI itself exits zero.
          if ($text -match 'NU1900') {
            throw "NuGet could not retrieve vulnerability data for $target (NU1900)."
          }
          if ($text -match 'has the following vulnerable packages') {
            throw "Vulnerable packages found in $target; the report is above."
          }
        }

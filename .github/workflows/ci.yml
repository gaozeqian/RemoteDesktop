name: CI

on:
  push:
    branches: [master]
  pull_request:

# Nothing in this workflow writes to the repository: the jobs read the checkout, upload test reports, and stop.
# The job that publishes a release is in release.yml, and it asks for contents: write itself.
permissions:
  contents: read

jobs:

  build-windows:
    # Each platform builds and tests on its own runner; the test steps themselves live in a shared action so that the
    # retry policy and the summary table cannot drift between them. The vulnerability audit is a shared action for the
    # same reason, and so is everything a Linux runner needs before its tests can run at all.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore RemoteDesktop.slnx --locked-mode
      - run: dotnet build RemoteDesktop.slnx --no-restore -c Release
      # THIRD-PARTY-NOTICES.md is generated from the dependency graph and then committed, because it ships inside the
      # installers. Nothing regenerates it when a package is bumped, and it had already drifted once in this
      # repository: it was missing FFmpeg.AutoGen entirely and still named two versions nothing referenced. That
      # drift is invisible in review, which is exactly why it survived. Regenerating here and failing on any
      # difference turns it into a red pull request.
      #
      # Only on this job, not on all three: the list is read with "dotnet list package" and no runtime identifier, so
      # it is identical on every platform — the committed list carries Avalonia.Win32, .X11 and .Native at once — and
      # there is one file. Running it three times would only mean three chances to be flaky.
      - name: Check the third-party notices are current
        shell: pwsh
        run: |
          pwsh -File build/tools/Export-ThirdPartyNotices.ps1

          # Test $LASTEXITCODE rather than the command's output: --quiet writes nothing, so PowerShell would evaluate
          # the call to an empty value and this step would fail on every pull request instead of on a stale file.
          git diff --quiet -- THIRD-PARTY-NOTICES.md
          if ($LASTEXITCODE -ne 0) {
              git --no-pager diff -- THIRD-PARTY-NOTICES.md
              throw 'THIRD-PARTY-NOTICES.md is out of date. Run build/tools/Export-ThirdPartyNotices.ps1 and commit the result.'
          }
      - name: Check the server-package quick guides are current
        shell: pwsh
        run: pwsh -NoProfile -File build/tools/Export-ServerConfigurationGuides.ps1 -Check
      # The build reports what is wrong with the packages a project references directly; this walks the whole graph,
      # including everything those packages drag in. A known-vulnerable dependency fails the build.
      - uses: ./.github/actions/audit-packages
      - uses: ./.github/actions/run-test-suite
        with:
          artifact-name: test-results-windows
      # The three MSIs are built here as well as at release time, and that is the whole point of the step. The scripts
      # under build/installer/windows/* otherwise only ever run when a tag is pushed, so anything that breaks them —
      # a project reference that no longer resolves, a file the publish stops producing, a WiX component that silently
      # drops content — would first be discovered while publishing a release, which is the one build nobody gets to
      # re-check before it is public. Here it is an ordinary red pull request.
      #
      # -SkipSigning because a runner has no code-signing certificate: without it the script would sign with whatever
      # it happened to find in the machine's store, which is not a property a build should depend on.
      - name: Build the Windows installers (MSI)
        shell: pwsh
        run: |
          .\build\installer\windows\client\Build-ClientInstaller.ps1 -Configuration Release -SkipSigning
          .\build\installer\windows\host\Build-HostInstaller.ps1 -Configuration Release -SkipSigning
          .\build\installer\windows\server\Build-ServerInstaller.ps1 -Configuration Release -SkipSigning

      # All three packages are opened and their contents checked, by the same shared action the other two platforms
      # call: one place answers "does this package hold what it is supposed to" for all three.
      - uses: ./.github/actions/verify-packages

      # Opening the database cannot see what a major upgrade does to files on disk. This installs the three MSIs,
      # moves the live settings into the old Program Files layout, reinstalls, and checks that the migration and the
      # normal upgrade both keep the operator's values. The runner is disposable; the script is only safe there.
      - name: Install, upgrade and uninstall the MSIs
        shell: pwsh
        run: ./build/installer/windows/Test-InstallerUpgrade.ps1

  build-linux:
    # The distro this port targets, and the one its tests were written against: FFmpeg 8 (libavcodec.so.62) and the
    # portal stack are what Ubuntu 26.04 ships. Pinned rather than ubuntu-latest, which still meant 24.04 when this
    # job was written -- where the library major version the video bindings load by soname does not exist -- and
    # which migrates on GitHub's own schedule rather than this repository's. release.yml's Linux job is pinned to the
    # same image, so the packages that ship come off the machine the package scripts were validated on.
    runs-on: ubuntu-26.04
    # The PostgreSQL halves of both stores are opt-in in the test code: with no server they skip, and the green result
    # then covers only the InMemory and SQLite implementations. Two of the three storage backends are not the product's
    # only deployment — the Docker path in build/docker runs PostgreSQL — so the suite that proves the contract holds
    # on it has to run somewhere on every push, and this is the one job with a container runtime next to a test run.
    # The tests make their own throw-away schema per case, so the two projects can run at the same time against it.
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RD_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=test;Database=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      # libmsquic, the FFmpeg and PulseAudio libraries the platform bindings load by soname, and a sound server with
      # a sink for the audio tests to talk to. Shared with release.yml's Linux job; the action says why each is there.
      - uses: ./.github/actions/prepare-linux-tests
      - run: dotnet restore RemoteDesktop.slnx --locked-mode
      - run: dotnet build RemoteDesktop.slnx --no-restore -c Release
      - uses: ./.github/actions/audit-packages
      - uses: ./.github/actions/run-test-suite
        with:
          artifact-name: test-results-linux
      # The three .deb packages are built here as well as at release time, and that is the whole point of the step.
      # The scripts under build/installer/linux/ otherwise only ever run when a tag is pushed, so anything that breaks them —
      # a project reference that no longer resolves, a file the publish stops producing, a version that stops being
      # readable out of Directory.Build.props — would first be discovered while publishing a release, which is the one
      # build nobody gets to re-check before it is public. Here it is an ordinary red pull request.
      #
      # Nothing is uploaded: the packages are several hundred megabytes of self-contained runtime each, and the
      # release job builds its own. What is being checked is that the scripts still work, not the bytes.
      - name: Test the Linux installer scripts with isolated stubs
        run: bash build/tools/test-linux-installer-scripts.sh
      - name: Build the Linux packages
        run: |
          build/installer/linux/client/build-deb.sh
          build/installer/linux/host/build-deb.sh
          build/installer/linux/server/build-deb.sh

      # A script that exits zero without producing a usable package is the failure this is here for: a package with
      # nothing in it would still be a package. The contents are checked by the same shared action the other two
      # platforms call.
      - uses: ./.github/actions/verify-packages

      - name: Install the Linux packages and verify the running services
        run: |
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ./artifacts/installer/linux/RemoteDesktop-Client-Linux-amd64-*.deb \
            ./artifacts/installer/linux/RemoteDesktop-Host-Linux-amd64-*.deb \
            ./artifacts/installer/linux/RemoteDesktop-Server-Linux-amd64-*.deb
          for unit in rendezvous relay ops gateway; do
            systemctl is-active --quiet "remotedesktop-$unit.service"
            pid="$(systemctl show -p MainPID --value "remotedesktop-$unit.service")"
            test "$pid" -gt 0
            test "$(ps -o user= -p "$pid" | tr -d ' ')" = remotedesktop
          done
          # The rendezvous answers the text "Healthy"; the relay and the console answer JSON, the console's naming the
          # database it probed. -f has already failed on anything but a 2xx, so the word is the whole assertion.
          for port in 5080 5083 5090; do
            curl -fsS "http://127.0.0.1:$port/health" | grep -qi healthy
          done
          test "$(curl -k -sS -o /dev/null -w '%{http_code}' https://127.0.0.1:5443/health)" = 404

  build-macos:
    # The floor this port targets is macOS 26 (Tahoe), because the libmsquic and openssl@4 bottles it ships record
    # minos 26.0 and dyld refuses to load them on anything older (docs/ports/README.md, "最低系统版本是 macOS 26"). That is also what makes
    # this job possible at all: on macos-latest (macos-14/15) every transport test would fail with "Unable to load
    # MsQuic library version '2'", which says nothing about this repository. macos-26 is the arm64 image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      # macOS gets no MsQuic from the .NET runtime pack, so nothing that touches the transport can even load without
      # this. It stages artifacts/lib/macos, and RemoteDesktop.Transport copies that directory next to every
      # executable that references it -- the test hosts included. It has to run before the build, because that copy is
      # an MSBuild glob over a directory that would otherwise not exist yet.
      - name: Stage the native MsQuic library
        run: ./native/macos/fetch-libmsquic.sh
      - run: dotnet restore RemoteDesktop.slnx --locked-mode
      - run: dotnet build RemoteDesktop.slnx --no-restore -c Release
      - uses: ./.github/actions/audit-packages
      - uses: ./.github/actions/run-test-suite
        with:
          artifact-name: test-results-macos
      # The three .pkg files are built here as well as at release time, and that is the whole point of the step: the
      # scripts under build/installer/macos/* otherwise only ever run when a tag is pushed, so a broken one — a project
      # reference that no longer resolves, a native library the publish stops carrying, a payload the launchd plists
      # no longer point at — would first be discovered while publishing a release, which is the one build nobody gets
      # to re-check before it is public. Here it is an ordinary red pull request.
      #
      # No --distribution: a runner has no Developer ID certificate, so the packages come out unsigned and the script
      # says so loudly. What is being checked is that the scripts still work, not the signature.
      - name: Test the macOS installer scripts with isolated stubs
        run: bash build/tools/test-macos-installer-scripts.sh
      - name: Build the macOS installers (.pkg)
        run: |
          ./build/installer/macos/client/make-pkg.sh --configuration Release
          ./build/installer/macos/host/make-pkg.sh   --configuration Release
          ./build/installer/macos/server/make-pkg.sh --configuration Release

      # The payload is what has to be right: a package that installs nothing would still be a package, and the scripts
      # do not assert that what they packed is in there. Same shared action as the other two platforms.
      - uses: ./.github/actions/verify-packages

      - name: Install the macOS packages and verify the running daemons
        run: |
          set -euo pipefail
          sudo installer -pkg artifacts/installer/macos/RemoteDesktop-Client-macOS-arm64-*.pkg -target /
          sudo installer -pkg artifacts/installer/macos/RemoteDesktop-Host-macOS-arm64-*.pkg -target /
          sudo installer -pkg artifacts/installer/macos/RemoteDesktop-Server-macOS-arm64-*.pkg -target /
          for label in com.remotedesktop.rendezvous com.remotedesktop.relay com.remotedesktop.ops com.remotedesktop.gateway; do
            launchctl print "system/$label" >/dev/null
            pid="$(launchctl print "system/$label" | awk '/^[[:space:]]*pid = [0-9]+$/ { print $3 }')"
            test -n "$pid"
            test "$(ps -o user= -p "$pid" | tr -d ' ')" = _remotedesktop
          done
          # The rendezvous answers the text "Healthy"; the relay and the console answer JSON, the console's naming the
          # database it probed. -f has already failed on anything but a 2xx, so the word is the whole assertion.
          for port in 5080 5083 5090; do
            curl -fsS "http://127.0.0.1:$port/health" | grep -qi healthy
          done
          test "$(curl -k -sS -o /dev/null -w '%{http_code}' https://127.0.0.1:5443/health)" = 404

  docker:
    # The Docker path was the only deployment nobody built: the compose file was invalid YAML and the relay image was
    # based on the runtime image even though the relay is an ASP.NET app, so both blockers were live at once. Parsing
    # every compose file and starting the images here turns those into ordinary red pull requests.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      # Test-only values. Both are valid base64 and long enough for the servers' start-up checks; they are not secrets.
      RELAY_SHARED_KEY: dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdA==
      RELAY_PUBLIC_ENDPOINT: 203.0.113.10:5082
      NODE_TOKEN: ci-node-token
      OPS_INGEST_KEY: dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleXRlc3Q=
      RENDEZVOUS_DOMAIN: rd.example.com
      OPS_GATEWAY_IP: 127.0.0.1
      # Placeholders for the self-signed overlay; `compose config` only interpolates them, the file need not exist.
      TLS_CERT_PATH: ./rd.example.pfx
      TLS_CERT_PASSWORD: ci-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - uses: ./.github/actions/audit-packages
      - name: Check the compose files parse
        run: |
          docker compose -f build/docker/docker-compose.yml config >/dev/null
          docker compose -f build/docker/docker-compose.yml -f build/docker/docker-compose.tls.yml config >/dev/null
          docker compose -f build/docker/docker-compose.yml -f build/docker/docker-compose.ops.yml config >/dev/null
          docker compose -f build/docker/docker-compose.yml -f build/docker/docker-compose.selfsigned.yml config >/dev/null
          docker compose -f build/docker/docker-compose.yml -f build/docker/docker-compose.selfsigned.yml -f build/docker/docker-compose.ops.yml config >/dev/null
      - name: Check .env.example does not satisfy the required values
        # The template leaves the secrets empty on purpose. If a placeholder ever returns, `cp .env.example .env` would
        # start the servers with a value everybody knows. The environment is cleared so the job's test values above
        # cannot mask it: with only the template as input, compose has to refuse.
        run: |
          if env -i PATH="$PATH" HOME="$HOME" docker compose --env-file build/docker/.env.example -f build/docker/docker-compose.yml config >/dev/null 2>&1; then
            echo "build/docker/.env.example satisfies the required values; they must stay empty." >&2
            exit 1
          fi
      - name: Smoke-test the security audit script
        # Nothing else runs build/tools/Invoke-SecurityAudit.ps1. The shipped default settings must be reported as
        # unsafe (exit 2: no database), and a configuration that sets what the audit looks at must pass (exit 0), so
        # the script can neither stop reporting nor start reporting everything.
        run: |
          set -u
          code=0
          pwsh -NoProfile -File build/tools/Invoke-SecurityAudit.ps1 \
            -SettingsPath src/Server/RemoteDesktop.Server.Rendezvous/appsettings.json >/dev/null || code=$?
          if [ "$code" -ne 2 ]; then
            echo "Expected exit code 2 for the default settings, got $code." >&2
            exit 1
          fi

          good=$(mktemp)
          cat > "$good" <<'JSON'
          {
            "Urls": "https://0.0.0.0:5080",
            "Rendezvous": {
              "RelayEndpoint": "",
              "NodeToken": "audit-smoke-token",
              "Database": { "Provider": "postgres", "ConnectionString": "Host=db" }
            }
          }
          JSON
          code=0
          pwsh -NoProfile -File build/tools/Invoke-SecurityAudit.ps1 -SettingsPath "$good" >/dev/null || code=$?
          rm -f "$good"
          if [ "$code" -ne 0 ]; then
            echo "Expected exit code 0 for a hardened configuration, got $code." >&2
            exit 1
          fi
      - name: Check the ops overlay seeds the local nodes
        # The ops image's ENTRYPOINT is the console, so a `command: [bash, -ec, ...]` on ops is only appended to it as
        # arguments and never runs; seeding is the job of the one-shot ops-seed service that ops waits for.
        run: |
          set -euo pipefail
          docker compose -f build/docker/docker-compose.yml -f build/docker/docker-compose.ops.yml config --format json > ops-config.json
          jq -e '.services.ops.command == null' ops-config.json
          jq -e '.services["ops-seed"].command[0] == "--seed-local-nodes"' ops-config.json
          jq -e '.services["ops-seed"].restart == "no"' ops-config.json
          jq -e '.services.ops.depends_on["ops-seed"].condition == "service_completed_successfully"' ops-config.json
          rm ops-config.json
      - name: Validate the Caddyfile
        run: |
          docker run --rm \
            -e RENDEZVOUS_DOMAIN="$RENDEZVOUS_DOMAIN" \
            -v "$PWD/build/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build the server images
        run: |
          docker build -f build/docker/Dockerfile.rendezvous -t remotedesktop/rendezvous:ci .
          docker build -f build/docker/Dockerfile.relay -t remotedesktop/relay:ci .
          docker build -f build/docker/Dockerfile.ops -t remotedesktop/ops:ci .
          docker build -f build/docker/Dockerfile.gateway -t remotedesktop/gateway:ci .
      - name: Smoke test rendezvous
        run: |
          set -euo pipefail
          docker run -d --name rd-rendezvous \
            -e Urls=http://0.0.0.0:5080 \
            -e Rendezvous__AllowInsecureSignaling=true \
            -e Rendezvous__RelayEndpoint="$RELAY_PUBLIC_ENDPOINT" \
            -e Rendezvous__RelaySharedKey="$RELAY_SHARED_KEY" \
            -e Rendezvous__NodeToken="$NODE_TOKEN" \
            -p 15080:5080 \
            remotedesktop/rendezvous:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:15080/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:15080/health

          # The internal face must refuse an unauthenticated caller from outside the container, and accept the token.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:15080/internal/v1/info)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $NODE_TOKEN" http://127.0.0.1:15080/internal/v1/info)" = "200"
      - name: Smoke test the relay
        run: |
          set -euo pipefail
          # The HTTP face is loopback in a normal deployment. The smoke test moves it to the container's external
          # interface and publishes that, which is what proves the web host — not just the UDP socket — came up.
          docker run -d --name rd-relay \
            -e Relay__SharedKey="$RELAY_SHARED_KEY" \
            -e Relay__NodeToken="$NODE_TOKEN" \
            -e Relay__HttpEndpoint=http://0.0.0.0:5083 \
            -p 15083:5083 \
            remotedesktop/relay:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:15083/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:15083/health
      - name: Smoke test the ops console through its gateway
        run: |
          set -euo pipefail
          # The console is not published; the gateway is the only listener. The dedicated subnet is what the console
          # trusts for X-Forwarded-For/X-Forwarded-Proto, mirroring docker-compose.ops.yml.
          docker network create --subnet 172.31.0.0/24 rd-ops-ci
          docker run -d --name rd-ops --network rd-ops-ci \
            -e Ops__Listen=http://0.0.0.0:5090 \
            -e Ops__Database__Path=/data/ops.db \
            -e Ops__TrustedProxies__0=172.31.0.0/24 \
            remotedesktop/ops:ci
          docker run -d --name rd-gateway --network rd-ops-ci \
            -e OPS_GATEWAY_IP="$OPS_GATEWAY_IP" \
            -e ReverseProxy__Clusters__ops__Destinations__loopback__Address=http://rd-ops:5090 \
            -p 15443:5443 \
            -v rd-gateway-ci:/data \
            remotedesktop/gateway:ci

          for _ in $(seq 1 60); do
            if curl -ksSf https://127.0.0.1:15443/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -ksSf https://127.0.0.1:15443/ >/dev/null
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:15443/health)" = "404"
          docker exec rd-gateway openssl x509 -in /data/gateway/tls/ops-gateway.crt \
            -noout -ext subjectAltName | grep -q "IP Address:$OPS_GATEWAY_IP"
      - name: Stop the containers
        if: always()
        run: |
          docker rm -f rd-rendezvous rd-relay rd-ops rd-gateway || true
          docker network rm rd-ops-ci || true
          docker volume rm rd-gateway-ci || true

  docs:
    # Documentation *formatting*: blank lines around headings and lists, indentation, ``` fences tagged with a
    # language. It is one job on one runner because it is a pure text rule with nothing platform-specific in it.
    #
    # Whether a document should exist, where it may live, what it may be called and whether its links resolve is
    # checked somewhere else -- DocumentationTests, in dotnet test, on all three runners. That split is deliberate
    # (docs/STYLE.md §6): markdownlint sees one file at a time and cannot know that a link points at a path no
    # longer there, and the test has no opinion about whitespace. Each checks what it is good at.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node comes from the runner image. It is not pinned to a setup-node action on purpose: the tool itself is
      # pinned below, which is the version that actually matters here.
      - name: Lint the Markdown
        # Pinned, not @latest. A new rule lands in a minor release and is on by default: MD060 (table column style)
        # arrived exactly that way and reported 249 findings on this repository's long-standing table style. With
        # @latest the build would go red one morning with nothing in the repository having changed. Bump this by
        # hand, in a commit that fixes whatever the new rules find.
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"

  # release.yml has per-platform packaging jobs of its own: each one builds and tests its port, packages the MSIs,
  # the .pkg and the three .deb files, and hands them to a single release job. The jobs here stay the place every
  # port is exercised on each push and pull request; the release jobs are the place each one is shipped.

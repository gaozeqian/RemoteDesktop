name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:

  build:
    # Each platform builds and tests on its own runner; the test steps themselves live in a shared action so that the
    # retry policy and the summary table cannot drift between them.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore RemoteDesktop.slnx
      - run: dotnet build RemoteDesktop.slnx --no-restore -c Release
      # The build reports what is wrong with the packages a project references directly; this walks the whole graph,
      # including everything those packages drag in. A known-vulnerable dependency fails the build.
      - name: Audit packages for known vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list RemoteDesktop.slnx package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') {
            throw "Vulnerable packages found; the report is above."
          }
      - uses: ./.github/actions/run-test-suite
        with:
          artifact-name: test-results-windows

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # System.Net.Quic is a thin managed wrapper over the native MsQuic library. Windows gets it from the runtime
      # pack; on Linux it is a separate package, and without it every test that opens a QUIC connection fails with
      # "QUIC is not supported on this system" rather than a missing-dependency error. Microsoft's own repository is
      # asked for the build matching whatever release the runner is on, so this does not have to be kept in step with
      # the runner image by hand.
      - name: Install libmsquic
        run: |
          . /etc/os-release
          curl -fsSL -o /tmp/packages-microsoft-prod.deb \
            "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmsquic
      - run: dotnet restore RemoteDesktop.slnx
      - run: dotnet build RemoteDesktop.slnx --no-restore -c Release
      - name: Audit packages for known vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list RemoteDesktop.slnx package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') {
            throw "Vulnerable packages found; the report is above."
          }
      - uses: ./.github/actions/run-test-suite
        with:
          artifact-name: test-results-linux
      # The three .deb packages are built here as well as at release time, and that is the whole point of the step.
      # The scripts under build/debian/ otherwise only ever run when a tag is pushed, so anything that breaks them —
      # a project reference that no longer resolves, a file the publish stops producing, a version that stops being
      # readable out of Directory.Build.props — would first be discovered while publishing a release, which is the one
      # build nobody gets to re-check before it is public. Here it is an ordinary red pull request.
      #
      # Nothing is uploaded: the packages are several hundred megabytes of self-contained runtime each, and the
      # release job builds its own. What is being checked is that the scripts still work, not the bytes.
      - name: Build the Linux packages
        run: |
          build/debian/client/build-deb.sh
          build/debian/host/build-deb.sh
          build/debian/server/build-deb.sh

      # A script that exits zero without producing a usable package is the failure this is here for: the release job
      # counts the files too, but a package with nothing in it would be counted just the same.
      - name: Check the packages hold what they are supposed to
        run: |
          set -eu

          count=$(ls -1 artifacts/debian/*.deb 2>/dev/null | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "Expected three packages, found $count:" >&2
            ls -la artifacts/debian/ >&2 || true
            exit 1
          fi

          # The dependencies have to be written by hand — our libraries are reached through DllImport, which
          # dpkg-shlibdeps cannot see — so a control file that has lost them installs cleanly and then fails on first
          # use. Every package declares something, whether in Depends or in Recommends (the server's msquic is
          # optional, so it is a Recommends).
          check() {
            package=$1
            binary=$2

            # The listing is read into a variable rather than piped into grep: grep stops at the first match and
            # closes the pipe, which leaves dpkg's tar writing into nothing and printing a broken-pipe error that
            # reads like a failure in a log that is otherwise green.
            contents=$(dpkg-deb --contents "$package")
            case "$contents" in
              *"$binary"*) ;;
              *)
                echo "$package does not contain $binary." >&2
                exit 1
                ;;
            esac

            declared=$(dpkg-deb --field "$package" Depends Recommends 2>/dev/null || true)
            if [ -z "$declared" ]; then
              echo "$package declares no dependencies or recommendations; the control file has probably lost them." >&2
              exit 1
            fi

            echo "--- $(dpkg-deb --field "$package" Package) $($(command -v stat) -c%s "$package") bytes"
            dpkg-deb --info "$package" | sed -n '1,10p'
          }

          check artifacts/debian/RemoteDesktop-Client-Linux-amd64-*.deb RemoteDesktop.Client
          check artifacts/debian/RemoteDesktop-Host-Linux-amd64-*.deb RemoteDesktop.HostService
          check artifacts/debian/RemoteDesktop-Server-Linux-amd64-*.deb Rendezvous

  build-macos:
    # The floor this port targets is macOS 26 (Tahoe), because the libmsquic and openssl@4 bottles it ships record
    # minos 26.0 and dyld refuses to load them on anything older (docs/macos-port-plan.md 3.4). That is also what makes
    # this job possible at all: on macos-latest (macos-14/15) every transport test would fail with "Unable to load
    # MsQuic library version '2'", which says nothing about this repository. macos-26 is the arm64 image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # macOS gets no MsQuic from the .NET runtime pack, so nothing that touches the transport can even load without
      # this. It stages artifacts/native/macos, and RemoteDesktop.Transport copies that directory next to every
      # executable that references it -- the test hosts included. It has to run before the build, because that copy is
      # an MSBuild glob over a directory that would otherwise not exist yet.
      - name: Stage the native MsQuic library
        run: ./native/macos/fetch-libmsquic.sh
      - run: dotnet restore RemoteDesktop.slnx
      - run: dotnet build RemoteDesktop.slnx --no-restore -c Release
      - name: Audit packages for known vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list RemoteDesktop.slnx package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') {
            throw "Vulnerable packages found; the report is above."
          }
      - uses: ./.github/actions/run-test-suite
        with:
          artifact-name: test-results-macos

  # release.yml has per-platform packaging jobs of its own: each one builds and tests its port, packages the MSIs,
  # the .pkg and the three .deb files, and hands them to a single release job. The jobs here stay the place every
  # port is exercised on each push and pull request; the release jobs are the place each one is shipped.

name: Release

on:
  push:
    tags:
      - 'v*.*.*' # 触发条件：当你推送 v1.0.0 这样的 Tag 时触发

# 只有最后的 release job 需要写权限，它自己声明 contents: write；其余四个（check-version、build-linux、
# build-macos、build-windows）只读仓库。
permissions:
  contents: read

jobs:
  # 版本只有一个来源：Directory.Build.props。资产名来自 Tag，包内版本来自那个文件——两者不一致时，Release 标题与
  # MSI 的 ProductVersion 会各说各话，而三个平台的打包 job 都不会失败。先在这里拦住。
  #
  # 同时要求 CHANGELOG 里有对应小节：发布说明是随 Tag 一起发出去的，写没写只有人知道；把它变成一条会红的检查。
  check-version:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the tag, the product version, generated package guides and the changelog agree
        run: |
          set -euo pipefail

          pwsh -NoProfile -File build/tools/Export-ServerConfigurationGuides.ps1 -Check

          # The same read and the same rules the packagers use: three numeric parts and within MSI's limits. Keeping
          # the rules in one place is why this job does not repeat the sed expression.
          . build/installer/version.sh
          if ! version=$(read_product_version "$PWD"); then
            echo "::error file=Directory.Build.props::The product version is missing, not three numeric parts, or outside the MSI limits (see above)."
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props."
            exit 1
          fi

          if ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section. Turn the [未发布] notes into the release's section before tagging."
            exit 1
          fi

  # The Linux packages. A separate job rather than a step, because a .deb has to be built on Linux: dpkg-deb does
  # not exist on the Windows runner and the publish has to be a Linux one anyway. Nothing is signed here — the
  # signing in the job below is Authenticode, which has no meaning to dpkg.
  #
  # 这个 job 与下面两个一样，自己把测试跑一遍。三个平台在这件事上必须一致：release 是唯一一个发出去之前
  # 没人再检查一遍的构建，而"Linux 那个 job 只打包"会让 Linux 成为唯一一个从未被测试过的发布产物。
  build-linux:
    needs: check-version
    # 与 ci.yml 的 build-linux 用同一个镜像，而不是 ubuntu-latest：发出去的包应该出自包脚本被验证过的那台
    # 机器，而不是出自 ubuntu-latest 这个月恰好指代的某个版本。
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      RD_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=test;Database=postgres
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      # 与 ci.yml 逐字同源的三件事：runner 准备（libmsquic / FFmpeg / PulseAudio / 声音服务器）、依赖漏洞
      # 审计、带重试策略的测试套件——都用同一份共享动作，所以两边不会各改一半。
      - uses: ./.github/actions/prepare-linux-tests

      - name: Restore and build
        run: |
          dotnet restore RemoteDesktop.slnx --locked-mode
          dotnet build RemoteDesktop.slnx --no-restore -c Release

      - uses: ./.github/actions/audit-packages

      - uses: ./.github/actions/run-test-suite
        with:
          artifact-name: test-results-linux-release

      # 三个包脚本自己从 Directory.Build.props 读版本、自己发布自包含产物，各自在 artifacts/ 里没有 libmsquic
      # 时自己去取——那是包必须带上的东西，.NET 运行时在 Linux 上不提供它。
      - name: Build the three .deb packages
        run: |
          build/installer/linux/client/build-deb.sh
          build/installer/linux/host/build-deb.sh
          build/installer/linux/server/build-deb.sh

      # 打开每个包看里面有什么，而不是数文件个数——与 ci.yml 及另外两个平台调用同一份共享动作。发出去的这三个
      # 包此前只被数过数量：内容不对的包照样会被数到。
      - uses: ./.github/actions/verify-packages

      # Named after the tag the way the MSIs are, so the release page does not mix v0.3.0 with 0.3.0. The version
      # being replaced is read rather than written down, or the first release to change it would silently stop
      # renaming anything and ship files named for the previous version.
      - name: Name them after the tag
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          for package in artifacts/installer/linux/*.deb; do
            mv "$package" "${package%-"$version".deb}-${GITHUB_REF_NAME}.deb"
          done
          ls -la artifacts/installer/linux/*.deb

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-packages
          path: artifacts/installer/linux/*.deb
          # 一个都没打出来时，失败要发生在这里并说清原因，而不是推迟到发布 job 去下载一个不存在的 artifact。
          if-no-files-found: error

  # macOS 的包只在凭据齐全时才构建：`.pkg` 必须签名并公证，缺一项就没有可发布的产物。Secret 不能出现在 job 级
  # `if` 里，所以先由一个只读 Secret 的小 job 把"齐不齐"变成 output，`build-macos` 与 `release` 都读它。
  #
  # 这里是这条规则唯一的例外，写清楚：凭据不全时**不构建** macOS 的包，发布只含 Windows 与 Linux 的六个包，
  # 发布说明里会写明少了哪一个和为什么。绝不发布未签名或未公证的 `.pkg`。
  check-signing:
    needs: check-version
    runs-on: ubuntu-26.04
    outputs:
      macos: ${{ steps.decide.outputs.ready }}
    env:
      HAS_APP_CERT: ${{ secrets.MACOS_APP_CERT_BASE64 != '' }}
      HAS_APP_PASSWORD: ${{ secrets.MACOS_APP_CERT_PASSWORD != '' }}
      HAS_INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_CERT_BASE64 != '' }}
      HAS_INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD != '' }}
      HAS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_BASE64 != '' }}
      HAS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID != '' }}
      HAS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID != '' }}
    steps:
      - name: Decide whether the macOS packages can be built
        id: decide
        run: |
          set -euo pipefail
          ready=true
          for name in HAS_APP_CERT HAS_APP_PASSWORD HAS_INSTALLER_CERT HAS_INSTALLER_PASSWORD \
                      HAS_NOTARY_KEY HAS_NOTARY_KEY_ID HAS_NOTARY_ISSUER; do
            if [ "${!name}" != "true" ]; then
              ready=false
              echo "::warning::$name is not configured."
            fi
          done

          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != "true" ]; then
            echo "::warning::macOS 签名或公证凭据不全：本次发布只含 Windows 与 Linux 的安装包。"
          fi

  # macOS 安装包（.pkg）。先跑，因为下面的发布 job 需要它的产物才能发版——
  # 只发出 Windows 的三个 MSI、悄悄少了 macOS 的包，是发完才会被发现的那种错；但缺凭据时连包都不构建，
  # 那种情况由 check-signing 的 output 明确标出，不是悄悄少。
  build-macos:
    needs: [check-version, check-signing]
    # 没有证书与公证凭据时不构建：下面打包步骤的断言会拒绝未签名的正式包，跳过比红一次更诚实。
    if: needs.check-version.result == 'success' && needs.check-signing.outputs.macos == 'true'
    # 这个移植的下限是 macOS 26 (Tahoe)：随包分发的 libmsquic / openssl@4 bottle 的 minos 是 26.0，
    # dyld 拒绝在更老的系统上加载（docs/ports/README.md"最低系统版本是 macOS 26"）。macos-26 就是 arm64 镜像。
    runs-on: macos-26
    # 正式发布必须具备证书与公证凭据：缺一项就停止，不发布未签名或未经公证的 .pkg。
    #
    # job 级 env 只放布尔值，不放 Secret 本身：job 级 env 对每一步都可见，包括 restore、build 与测试进程（测试代码
    # 读得到环境变量）。Secret 只出现在确实要用它的那几步自己的 env 里（导入证书、打包 + 公证）。布尔值放在
    # job 级而不是 step 级，是因为 step 自己的 env 能否被它自己的 if 读到并没有保证。
    env:
      # 两张证书都配了才签名；与下面导入步骤、打包步骤用的是同一个条件。
      MACOS_SIGNED: ${{ secrets.MACOS_APP_CERT_BASE64 != '' && secrets.MACOS_INSTALLER_CERT_BASE64 != '' }}
      # 三个公证 Secret 都配了才公证；只在已签名时才有意义。
      MACOS_NOTARIZED: ${{ secrets.MACOS_NOTARY_KEY_BASE64 != '' && secrets.MACOS_NOTARY_KEY_ID != '' && secrets.MACOS_NOTARY_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      # macOS 不从 .NET 运行时包拿到 MsQuic，任何碰传输层的东西没有它连加载都做不到。
      - name: Stage the native MsQuic library
        run: ./native/macos/fetch-libmsquic.sh
      - name: Restore and build
        run: |
          dotnet restore RemoteDesktop.slnx --locked-mode
          dotnet build RemoteDesktop.slnx --no-restore -c Release
      # 与 ci.yml 逐字同源：release 是唯一一个发出去之前没人再检查一遍的构建，依赖漏洞必须在这里也拦住。
      # 此前这一步只在 Windows 那个 job 里有——三个平台里只有一个在发版时审过依赖。
      - uses: ./.github/actions/audit-packages
      # 与 ci.yml 同一策略：release 是唯一一个发出去之前没人再检查一遍的构建，所以它自己跑测试。
      - uses: ./.github/actions/run-test-suite
        with:
          artifact-name: test-results-macos-release

      # 把两张 Developer ID 证书导入一个**临时**钥匙串（不用登录钥匙串：runner 上那个是空的，而且用完即弃）。
      # 不用第三方 action，理由与下面用 gh 而不用 softprops 相同：少一个会停维护的依赖。
      #
      # 需要的 Secret：
      #   MACOS_APP_CERT_BASE64 / MACOS_APP_CERT_PASSWORD          —— "Developer ID Application" 的 .p12
      #   MACOS_INSTALLER_CERT_BASE64 / MACOS_INSTALLER_CERT_PASSWORD —— "Developer ID Installer" 的 .p12
      # 生成方式（本机，导出为 base64 单行）：
      #   security export -k login.keychain-db -t identities -f pkcs12 -o app.p12 -P <口令>
      #   base64 -i app.p12 | tr -d '\n'
      - name: Import the Developer ID certificates (optional)
        if: env.MACOS_SIGNED == 'true'
        env:
          APP_CERT_BASE64: ${{ secrets.MACOS_APP_CERT_BASE64 }}
          APP_CERT_PASSWORD: ${{ secrets.MACOS_APP_CERT_PASSWORD }}
          INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_BASE64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/rd-signing.keychain-db"
          KC_PW="$(openssl rand -hex 16)"

          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security default-keychain -s "$KC"

          # -A 是因为 [Convert]::ToBase64String 出来的是一整行，没有换行。
          printf '%s' "$APP_CERT_BASE64"       | openssl base64 -d -A -out "$RUNNER_TEMP/app.p12"
          printf '%s' "$INSTALLER_CERT_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/installer.p12"

          # -T 把"允许这两个工具使用这把私钥"写进钥匙串项；少了它，codesign/productbuild 会卡在授权弹窗上
          # （CI 里没人能点），报出来是含糊的 "User interaction is not allowed"。
          security import "$RUNNER_TEMP/app.p12" -k "$KC" -P "$APP_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$INSTALLER_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security

          # 让上述 -T 在非交互环境下真正生效。
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KC_PW" "$KC" >/dev/null
          # The inner list is deliberately unquoted: its words are keychains to add, not one argument.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

          echo "==> Signing identities available:"
          security find-identity -v -p codesigning "$KC"
          # The Installer certificate has no Code Signing EKU and is absent from the filtered list above; the
          # packagers search for it without the filter. Print both so a missing identity is visible here.
          security find-identity -v "$KC"

      # 三个 .pkg：客户端（Remote Desktop.app）、被控端（独立的 Remote Desktop Host.app，无窗口）与服务端
      # （信令、中继、监控台与 HTTPS 网关 + 四个 launchd 守护进程）。客户端与被控端各自发布自己的 app；它们 bundle id 不同，
      # TCC 授权也分开，不能互相复用。
      # 正式发布固定使用 --distribution --notarize；缺证书或公证凭据时本步直接失败。
      - name: Build the macOS installers (.pkg)
        # 公证凭据只在这一步的环境里：make-pkg.sh 自己读 NOTARY_KEY_ID / NOTARY_ISSUER_ID / NOTARY_KEY_PATH。
        # 证书不在这里——签名用的是上一步导入钥匙串的身份。
        env:
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          args=(--configuration Release)

          if [[ "$MACOS_SIGNED" == "true" ]]; then
            args+=(--distribution)
            if [[ "$MACOS_NOTARIZED" == "true" ]]; then
              printf '%s' "$NOTARY_KEY_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/notary_key.p8"
              export NOTARY_KEY_PATH="$RUNNER_TEMP/notary_key.p8"
              args+=(--notarize)
            else
              echo "::error::A formal release requires MACOS_NOTARY_KEY_BASE64, MACOS_NOTARY_KEY_ID and MACOS_NOTARY_ISSUER_ID."
              exit 1
            fi
          else
            echo "::error::A formal release requires the Developer ID application and installer certificates."
            exit 1
          fi

          ./build/installer/macos/client/make-pkg.sh "${args[@]}"
          ./build/installer/macos/host/make-pkg.sh   "${args[@]}"
          ./build/installer/macos/server/make-pkg.sh "${args[@]}"

      # 打开三个包的 payload 看里面有什么（客户端那个必须带着 Info.plist，被控端那个必须带着登录项 plist，
      # 服务端那四个必须带着各自的 launchd plist），与 ci.yml 及另外两个平台调用同一份共享动作。
      - uses: ./.github/actions/verify-packages

      # 三个包都落在 artifacts/installer/macos/，文件名里已经带角色词，这一步只是把版本换成 Tag。
      - name: Rename the installers for the release
        run: |
          set -euo pipefail
          cd artifacts/installer/macos
          # 三个角色都写全：九个资产同一个形状 <产品>-<角色>-<平台>-<架构>-<tag>.<扩展名>。
          for file in *.pkg; do
            case "$file" in
              RemoteDesktop-Server-*) role=Server ;;
              RemoteDesktop-Host-*)   role=Host ;;
              RemoteDesktop-Client-*) role=Client ;;
              *) echo "Unexpected installer name: $file" >&2; exit 1 ;;
            esac
            mv "$file" "RemoteDesktop-$role-macOS-arm64-${GITHUB_REF_NAME}.pkg"
          done
          ls -la

      - name: Upload the macOS installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-installer
          path: artifacts/installer/macos/*.pkg
          # 同上：一个都没打出来就在这里红，而不是让发布 job 去下载一个不存在的 artifact。
          if-no-files-found: error

  # Windows 那条腿（ci.yml 里同名），只打包与自检，不发版。三个平台在这件事上形状一致：都叫 build-<平台>，
  # 都只产出 artifact；发版是文件末尾的 release job 一个人的事（它等这三个都做完）。
  build-windows:
    needs: check-version
    runs-on: windows-latest

    # job 级 env 只放布尔值，不放证书与口令本身：job 级 env 对每一步都可见，包括 restore、build 与测试进程（测试
    # 代码读得到环境变量）。Secret 不能直接写进 if，所以 if 读这里的布尔值；而布尔值必须放在 job 级别才有保证——
    # step 自己那份 env 能否被它自己的 if 读到并没有说明。证书与口令只出现在解码证书、构建并签名 MSI 的那几步自己的 env 里。
    env:
      HAS_PFX_CERT: ${{ secrets.CODE_SIGN_CERT_BASE64 != '' }}
      HAS_PFX_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      # A release is the one build nobody gets to re-check before it is public, so it runs the tests itself rather
      # than trusting that CI passed on some earlier commit.
      - name: Restore and build
        run: |
          dotnet restore RemoteDesktop.slnx --locked-mode
          dotnet build RemoteDesktop.slnx --no-restore -c Release

      # A release is the one build nobody re-checks before it is public, so a known-vulnerable dependency must stop it
      # here exactly as it stops CI — through the same shared action, so that the rule cannot drift between the two.
      - uses: ./.github/actions/audit-packages

      # Same retry-once policy as ci.yml, and now literally the same steps: this used to be a copy of the shared
      # action's script. A copy is how the two drift — it did not upload the TRX files or write the summary table, and
      # nothing would have failed if only one of the two was ever updated. A release is still not published on a red
      # run: the second failure fails the step.
      - uses: ./.github/actions/run-test-suite
        with:
          artifact-name: test-results-windows-release

      # 客户端安装包要不要内置服务器地址，由仓库变量 DEFAULT_RENDEZVOUS_URI 决定
      # （Settings -> Secrets and variables -> Actions -> Variables）。
      #
      # 没配置不是错误，而是选中了"不内置"：本软件公网和内网都要用，服务器地址往往是部署时才定的，一个装在
      # 用户机器上的包内置谁的地址都不对。这样的包默认连它自己那台机器，连不上时客户端界面会直说"未连接服务器
      # （地址）"并告诉用户去哪儿改，所以不会变成"看着正常、就是连不上"。
      #
      # 这里只决定 -RendezvousUri 传不传。发布说明里那句"内置了哪个地址"由 release job 读同一个变量自己生成，
      # 不靠 job 之间的环境变量传递——环境变量传不过 job 边界，而这里能传到下个 job 的只有 artifact。
      - name: Decide the server address
        shell: pwsh
        # The variable is read from the environment, not interpolated into the script text: a value containing a quote
        # or a $( ) would otherwise be parsed as PowerShell.
        env:
          DEFAULT_RENDEZVOUS_URI: ${{ vars.DEFAULT_RENDEZVOUS_URI }}
        run: |
          $address = $env:DEFAULT_RENDEZVOUS_URI
          if ($address) {
              Write-Host "The client installer will point at $address."
              "DEFAULT_SERVER=$address" >> $env:GITHUB_ENV
          } else {
              Write-Warning 'No DEFAULT_RENDEZVOUS_URI: the client installer gets no built-in address.'
          }

      # 正式发布的 PKCS#12 证书以 Base64 存在 GitHub Secrets 中；缺失时后续构建步骤直接失败。
      # 下面演示了如何从 Secrets 获取 PFX 证书并解码：
      - name: Decode Code Signing Certificate (Optional)
        if: env.HAS_PFX_CERT == 'true'
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
        run: |
          $pfxBytes = [System.Convert]::FromBase64String($env:PFX_BASE64)
          [System.IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\sign.pfx", $pfxBytes)

      # 运行构建脚本打包 MSI（客户端 / 被控端）。服务器地址由上一步决定：有就内置，没有就不传
      # -RendezvousUri（脚本保留项目里的默认值，并在日志里给出警告）。
      #
      # 参数用哈希表展开（@{} 按名字绑定）而不是数组展开：@() 是**按位置**传参的，写成
      # @('-Configuration','Release') 会让 '-Configuration' 这个字符串成为第一个位置参数的值，参数名根本不起作用
      # ——第一次跑 v0.2.0 就是这么失败的（目录被建成名为 `-Configuration` 的文件夹，WiX 找不到 SourceRoot）。
      - name: Build MSI Installer
        shell: pwsh
        # 口令只在三个构建步骤里（证书已由上面解码成 sign.pfx）；是否签名读 job 级的布尔值。
        env:
          PFX_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}
        run: |
          $arguments = @{ Configuration = 'Release' }
          if ($env:DEFAULT_SERVER) { $arguments.RendezvousUri = $env:DEFAULT_SERVER }
          if ($env:HAS_PFX_CERT -eq 'true' -and $env:HAS_PFX_PASSWORD -eq 'true') {
              $arguments.CertificateFile = "$env:GITHUB_WORKSPACE\sign.pfx"
              $arguments.CertificatePassword = $env:PFX_PASSWORD
          } else {
              throw 'A formal release requires CODE_SIGN_CERT_BASE64 and CODE_SIGN_CERT_PASSWORD.'
          }

          .\build\installer\windows\client\Build-ClientInstaller.ps1 @arguments

      # 被控端自己的 MSI：同一个服务与会话 Agent，没有客户端窗口。参数与客户端那个逐字一致（服务器地址、签名），
      # 因为它走的是同一个脚本的 -HostOnly 分支——两份服务定义迟早会分叉，这里不留第二份。
      - name: Build Host MSI Installer
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}
        run: |
          $arguments = @{ Configuration = 'Release' }
          if ($env:DEFAULT_SERVER) { $arguments.RendezvousUri = $env:DEFAULT_SERVER }
          if ($env:HAS_PFX_CERT -eq 'true' -and $env:HAS_PFX_PASSWORD -eq 'true') {
              $arguments.CertificateFile = "$env:GITHUB_WORKSPACE\sign.pfx"
              $arguments.CertificatePassword = $env:PFX_PASSWORD
          } else {
              throw 'A formal release requires CODE_SIGN_CERT_BASE64 and CODE_SIGN_CERT_PASSWORD.'
          }

          .\build\installer\windows\host\Build-HostInstaller.ps1 @arguments

      # 服务端（信令 + 中继 + 监控台 + HTTPS 网关）的安装包。和上面那些用同一套签名参数、同一个版本号，但是三个各自独立安装的包：
      # 一台机器可以只做被控端、只做服务器，或者都做。
      - name: Build Server MSI Installer
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}
        run: |
          if ($env:HAS_PFX_CERT -eq 'true' -and $env:HAS_PFX_PASSWORD -eq 'true') {
              .\build\installer\windows\server\Build-ServerInstaller.ps1 -Configuration Release -CertificateFile "$env:GITHUB_WORKSPACE\sign.pfx" -CertificatePassword $env:PFX_PASSWORD
          } else {
              throw 'A formal release requires CODE_SIGN_CERT_BASE64 and CODE_SIGN_CERT_PASSWORD.'
          }

      # 打开三个 MSI 的数据库看里面有什么（payload、服务与崩溃重启、防火墙规则、快捷方式、向导页与许可文本），
      # 与 ci.yml 及另外两个平台调用同一份共享动作。
      - uses: ./.github/actions/verify-packages

      # 数据库检查看不到大版本升级对磁盘上文件做了什么。这里真正安装三个 MSI、把 live 设置放回旧的
      # Program Files 布局、重装，检查迁移与普通升级都保留运维的值。runner 是一次性的，脚本只适合在这种机器上跑。
      - name: Install, upgrade and uninstall the MSIs
        shell: pwsh
        run: ./build/installer/windows/Test-InstallerUpgrade.ps1

      # 将打好的三个 MSI 提取出来
      - name: Rename Artifacts for Release
        shell: pwsh
        run: |
          # 三个包都在同一个 artifacts/installer/windows/ 下，角色写在文件名里。**构建产物**的名字来自 wixproj 的
          # OutputName，与 macOS、Linux 同一个形状 <产品>-<角色>-<平台>-<架构>-<版本>：
          # RemoteDesktop-Client-Windows-x64-<版本>.msi、RemoteDesktop-Host-Windows-x64-<版本>.msi、
          # RemoteDesktop-Server-Windows-x64-<版本>.msi。带 Tag 的是**发布产物**的名字（下面重命名之后）。
          # 三个 glob 各匹配各的角色，前缀互不重叠，不再需要 notlike 排除。
          $installerFolder = 'artifacts/installer/windows'
          $client = Get-ChildItem -Path "$installerFolder/RemoteDesktop-Client-Windows-x64-*.msi" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $hostPackage = Get-ChildItem -Path "$installerFolder/RemoteDesktop-Host-Windows-x64-*.msi" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $server = Get-ChildItem -Path "$installerFolder/RemoteDesktop-Server-Windows-x64-*.msi" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1

          # 少一个就什么都别发：只发出客户端、悄悄少了被控端或服务端，是发完才会被发现的那种错。
          if (-not $client) { throw "No client installer in $installerFolder." }
          if (-not $hostPackage) { throw "No host installer in $installerFolder." }
          if (-not $server) { throw "No server installer in $installerFolder." }

          # 按 GitHub Tag（例如 v1.0.0）重命名成发布资产：<产品>-<角色>-<平台>-<架构>-<tag>.<扩展名>，
          # 与 macOS、Linux 那两步同一个形状（见上面 macOS 那步的注释）。
          $clientName = "RemoteDesktop-Client-Windows-x64-$($env:GITHUB_REF_NAME).msi"
          $hostName = "RemoteDesktop-Host-Windows-x64-$($env:GITHUB_REF_NAME).msi"
          $serverName = "RemoteDesktop-Server-Windows-x64-$($env:GITHUB_REF_NAME).msi"
          Rename-Item -Path $client.FullName -NewName $clientName
          Rename-Item -Path $hostPackage.FullName -NewName $hostName
          Rename-Item -Path $server.FullName -NewName $serverName
          Write-Output "Renamed to $clientName, $hostName and $serverName."

      # 名字里已经带 Tag，就是发布资产名；release job 下载下来直接上传，中间不再改。
      - name: Upload the MSIs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-packages
          path: artifacts/installer/windows/*.msi
          # 同上：一个都没打出来就在这里红，而不是让发布 job 去下载一个不存在的 artifact。
          if-no-files-found: error

  # 发布本身：不打包任何东西，只等三个平台的 artifact 到齐，把九个包与发布说明交给 GitHub。从 Windows 那个 job
  # 里拆出来，是为了 job 列表里三个 build-<平台> 形状一致，而且"发版"这件事只有一个地方能发生。
  release:
    # 每个平台做完才发：发布是一个原子动作，缺一个产物就不该发（见上面 build-linux 与 build-macos 的注释）。
    #
    # 唯一的例外是 macOS 因凭据不全被**跳过**：那种情况不是"少了一个产物"，而是"这个平台这次不发布"，由
    # check-signing 的 output 决定，发布说明里会写明。真正失败的构建（failure）仍然拦下发布。
    needs: [check-version, check-signing, build-linux, build-macos, build-windows]
    # `>-` 把这些行折成一行表达式：多行的 `|` 会带上换行，规则和可读性都靠一行更稳妥。
    if: >-
      always()
      && needs.check-version.result == 'success'
      && needs.build-linux.result == 'success'
      && needs.build-windows.result == 'success'
      && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    # 与 build-windows 同一个 runner：发布说明用 pwsh 拼，gh 在托管 runner 上预装。
    runs-on: windows-latest

    # 唯一需要写权限的 job：发版要往 Releases 写文件。
    permissions:
      contents: write

    # job 级 env 只放布尔值，理由与 build-windows 相同——但这里没有 if 读它，只是为了把两处判断收敛到一处写法。
    # 发布说明必须如实写出各包有没有签名/公证，而这个事实由 Secret 有没有决定：这里读同一批 Secret 得到的就是
    # 构建 job 得到的答案，不必（也不该）为了传一句话而把 Secret 下发到更多地方。
    env:
      HAS_PFX_CERT: ${{ secrets.CODE_SIGN_CERT_BASE64 != '' }}
      HAS_PFX_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD != '' }}
      # 与 build-macos 同一个条件：两张证书都配了才签名，三个公证 Secret 都配了才公证。
      MACOS_SIGNED: ${{ secrets.MACOS_APP_CERT_BASE64 != '' && secrets.MACOS_INSTALLER_CERT_BASE64 != '' }}
      MACOS_NOTARIZED: ${{ secrets.MACOS_NOTARY_KEY_BASE64 != '' && secrets.MACOS_NOTARY_KEY_ID != '' && secrets.MACOS_NOTARY_ISSUER_ID != '' }}

    steps:
      # 只为 .git：gh 靠仓库推断往哪个 repo 发版。这个 job 不构建任何东西。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 发布说明描述下载者拿到的包：地址是否内置，以及正式签名/公证和 Windows 本机授权边界。
      - name: Decide the release note
        shell: pwsh
        # The variable is read from the environment, not interpolated into the script text: a value containing a quote
        # or a $( ) would otherwise be parsed as PowerShell.
        env:
          DEFAULT_RENDEZVOUS_URI: ${{ vars.DEFAULT_RENDEZVOUS_URI }}
          MACOS_BUILT: ${{ needs.check-signing.outputs.macos }}
        run: |
          $address = $env:DEFAULT_RENDEZVOUS_URI
          if ($address) {
              $note = "Windows 客户端与被控端安装包已内置信令服务器地址 ``$address``：装完直接可用。macOS 与 Linux 的包不内置地址，安装时会询问（macOS 的 Installer 配置页 / Linux 的 debconf）；没有无人值守答案时按默认值安装。"
          } else {
              # PowerShell 的 here-string 要求结束符顶格，而 YAML 的 run: | 块里每一行都必须缩进——两者不能共存，
              # 所以这里用数组拼（而不是 @"..."@）。
              $note = @(
                  '> [!IMPORTANT]'
                  '> **本安装包没有内置服务器地址**，客户端默认连的是本机。装完后请在客户端里用「修改服务器地址」'
                  '> 填入你自己的服务器（生产用 `wss://域名:5080/ws`；`ws://127.0.0.1:5080/ws` 仅限回环联调）。'
                  '> 部署步骤见 [docs/ops/README.md](https://github.com/gaozeqian/RemoteDesktop/blob/master/docs/ops/README.md)。'
              ) -join "`n"
          }

          # The boundaries a downloader has to know before installing, not after. Written here rather than left to
          # the generated notes, which describe commits and not what the package will or will not protect.
          $boundaries = [System.Collections.Generic.List[string]]::new()
          $boundaries.Add('> [!WARNING]')
          $boundaries.Add('> **Windows 本机用户边界**：只有管理员或当前 Agent 所服务的用户会话可以读取设备码与密码、')
          $boundaries.Add('> 修改固定密码；其他本机账户与其他 Windows 会话会被控制管道拒绝。')
          $boundaries.Add('> 见 [安全边界](https://github.com/gaozeqian/RemoteDesktop/blob/master/docs/design/README.md#3-安全边界)。')

          # macOS 只有在构建过的时候才要求签名与公证：构建过却没签，是错的；没构建，是这个平台这次不发布。
          if ($env:MACOS_BUILT -eq 'true' -and ($env:MACOS_SIGNED -ne 'true' -or $env:MACOS_NOTARIZED -ne 'true')) {
              throw 'The macOS build reported success without signing or notarization; refusing to publish it.'
          }

          if ($env:MACOS_BUILT -ne 'true') {
              $boundaries.Insert(0, '')
              $boundaries.Insert(0, '> 配好 `MACOS_APP_CERT_BASE64` / `MACOS_INSTALLER_CERT_BASE64` / `MACOS_NOTARY_*` 之后重跑本工作流即可补上。')
              $boundaries.Insert(0, '> **本次发布不含 macOS 安装包**：仓库没有配置 Developer ID 证书与公证凭据，未签名或未经公证的 `.pkg` 不发布。')
              $boundaries.Insert(0, '> [!NOTE]')
          }

          # The build jobs have already enforced these credentials. Repeat the assertion before the write-only job.
          if (-not ($env:HAS_PFX_CERT -eq 'true' -and $env:HAS_PFX_PASSWORD -eq 'true')) {
              throw 'The signed Windows build did not complete; refusing to publish unsigned MSIs.'
          }

          $note = $note + "`n`n" + ($boundaries -join "`n")

          # 有地址就写清是哪一个，没有就提醒要自己填——两种都是一个句子，所以这个文件总是存在。
          # GitHub 会把它放在自动生成的 release notes 前面。
          Set-Content -Path release-body.md -Value $note -Encoding utf8

      # 三个 MSI 在 build-windows 里打好并按 Tag 改过名，这里原样取回。
      - name: Download the Windows packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-packages
          path: windows-packages

      # 三个 Linux 包在 build-linux 里打好，这里取回来。少了就什么都不发——和上面 MSI 一样的理由：只发出其中
      # 一部分，是发完才会被发现的那种错。
      - name: Download the Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-packages
          path: linux-packages

      # 取回 build-macos 打好的 .pkg。用 artifact 而不是让 macOS job 自己上传 Release，是为了让"发版"只发生
      # 在这一处——否则 Windows 和 macOS 会各自尝试创建同一个 Release，谁先谁后不定。
      - name: Download the macOS installer
        # 凭据不全时那个 job 是 skipped，没有 artifact 可取——发布说明里已经写明这次不含 macOS。
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-installer
          path: macos-installer

      # 上传至 GitHub Release：一个版本一个 Release，九个包都放在里面（装的机器不同，版本是同一个）。
      # body 会被放在自动生成的 release notes 前面，所以"这个包有没有内置地址"永远写在最上面。
      # 用官方 gh CLI 取代第三方 softprops/action-gh-release（上游已停维护）；gh 在托管 runner 上预装，
      # github.token 已有 contents:write 权限。
      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # 这一处只清点，不校验内容：每个平台的包已经在它自己的 job 里被打开看过了（dpkg-deb / pkgutil / MSI
          # 数据库各自只存在于那一个平台上，共享动作因此按 runner.os 分三支）。这里要回答的是另一个问题——
          # 九个包是不是都到了，少一个就什么都不发。
          #
          # Linux 的包按平台惯例用 amd64，Windows 的用 x64——各随各的约定，不为了让列表整齐而互相将就。
          $linux = @(Get-ChildItem -Path linux-packages/*.deb -ErrorAction SilentlyContinue)
          if ($linux.Count -ne 3) {
              throw "Expected three Linux packages, found $($linux.Count)."
          }

          # macOS 三个角色各一个，或者一个都没有（凭据不全时那个 job 没有运行）。有一个却不齐，说明 build-macos
          # 只出了一部分，而那是发完才会被发现的那种错。
          $packages = @(Get-ChildItem -Path macos-installer/*.pkg -ErrorAction SilentlyContinue)
          if ($packages.Count -gt 0 -and $packages.Count -ne 3) {
              throw "Expected three macOS installers or none, found $($packages.Count)."
          }

          # Windows 三个来自 build-windows。少一个就说明那个 job 只出了一部分。
          $windows = @(Get-ChildItem -Path windows-packages/*.msi -ErrorAction SilentlyContinue)
          if ($windows.Count -ne 3) { throw "Expected the Windows client, host and server installers from build-windows, got $($windows.Count)." }

          # 三个变量都是 FileInfo，.FullName 各取一次。此前这里混着两种形状（一个存 FileInfo，两个存 FullName 字符串），
          # 于是 `$windows.FullName` 静默成了空数组——清点通过、三个 MSI 却没上传，v1.0.1 第一次发布就少了一半资产。
          #
          # macOS 那一段走管道而不是 @($packages.FullName)：空数组的 .FullName 是 $null，@($null) 会变成一个含 null
          # 的元素，于是下面那条断言会把 6 个资产数成 7 个。
          $assets = @($windows.FullName) + @($linux.FullName) + @($packages | ForEach-Object { $_.FullName })
          if ($assets.Count -ne (6 + $packages.Count)) {
              throw "Expected $(6 + $packages.Count) assets, collected $($assets.Count)."
          }

          $hashes = $assets | Sort-Object | ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_
              "$($hash.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_)"
          }
          [System.IO.File]::WriteAllLines("$PWD/SHA256SUMS", [string[]]$hashes, [System.Text.UTF8Encoding]::new($false))

          gh release create "$env:GITHUB_REF_NAME" `
            $assets "SHA256SUMS" `
            --title "$env:GITHUB_REF_NAME" `
            --notes-file release-body.md `
            --generate-notes

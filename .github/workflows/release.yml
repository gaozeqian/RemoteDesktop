name: Release

on:
  push:
    tags:
      - 'v*.*.*' # 触发条件：当你推送 v1.0.0 这样的 Tag 时触发

jobs:
  # macOS 安装包（.pkg）。先跑，因为下面的发布 job 需要它的产物才能发版——
  # 只发出 Windows 的两个 MSI、悄悄少了 macOS 的包，是发完才会被发现的那种错。
  build-macos:
    # 这个移植的下限是 macOS 26 (Tahoe)：随包分发的 libmsquic / openssl@4 bottle 的 minos 是 26.0，
    # dyld 拒绝在更老的系统上加载（docs/macos-port-plan.md §3.4）。macos-26 就是 arm64 镜像。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # macOS 不从 .NET 运行时包拿到 MsQuic，任何碰传输层的东西没有它连加载都做不到。
      - name: Stage the native MsQuic library
        run: ./native/macos/fetch-libmsquic.sh
      - name: Restore and build
        run: |
          dotnet restore RemoteDesktop.slnx
          dotnet build RemoteDesktop.slnx --no-restore -c Release
      # 与 ci.yml 同一策略：release 是唯一一个发出去之前没人再检查一遍的构建，所以它自己跑测试。
      - uses: ./.github/actions/run-test-suite
        with:
          artifact-name: test-results-macos-release
      # 打包成 .pkg（装到 /Applications）。脚本会顺带构建 .app 与原生辅助库。
      # 包是**未签名**的：没有配 Apple Developer ID Installer 证书。在别人的 Mac 上 Gatekeeper 会提示
      # "unidentified developer"，用户需要右键 → 打开。签名 + 公证是另一件事，依赖付费账号，见脚本头部说明。
      - name: Build the macOS .pkg
        run: ./build/installer/client/macos/make-pkg.sh --configuration Release
      - name: Rename the installer for the release
        run: |
          set -euo pipefail
          src="$(ls artifacts/pkg/macos/*.pkg | head -1)"
          dst="artifacts/pkg/macos/RemoteDesktop-macOS-arm64-${GITHUB_REF_NAME}.pkg"
          mv "$src" "$dst"
          echo "macOS installer: $dst"
      - name: Upload the macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: artifacts/pkg/macos/*.pkg

  build-and-release:
    # 等 macOS 包先出来：发布是一个原子动作，缺一个产物就不该发（见上面 build-macos 的注释）。
    needs: build-macos
    runs-on: windows-latest

    # 权限配置：允许向 Releases 写入文件
    permissions:
      contents: write

    # 证书 Secrets 放在 job 级别：GitHub 文档给的做法是"把 Secret 放进 env，再在 step 的 if 里用 env.X 判断"
    # （Secret 不能直接写进 if），而这里必须是 job 级别的 env 才有保证——step 自己那份 env 能否被它自己的 if
    # 读到并没有说明。下面解码证书的那一步就靠它判断有没有配置证书。
    env:
      PFX_BASE64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
      PFX_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # A release is the one build nobody gets to re-check before it is public, so it runs the tests itself rather
      # than trusting that CI passed on some earlier commit.
      - name: Restore and build
        run: |
          dotnet restore RemoteDesktop.slnx
          dotnet build RemoteDesktop.slnx --no-restore -c Release

      # A release is the one build nobody re-checks before it is public, so a known-vulnerable dependency must stop it
      # here exactly as it stops CI. The report walks the whole transitive graph, not just direct references.
      - name: Audit packages for known vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list RemoteDesktop.slnx package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') {
            throw "Vulnerable packages found; the report is above."
          }

      # Same retry-once policy as ci.yml (see the comment there): the integration suite is timing-sensitive on a
      # runner and red-flags a different test from run to run. A release is still not published on a red run — the
      # second failure fails the step — but a single flake no longer holds up a release.
      - name: Test
        shell: pwsh
        run: |
          dotnet test RemoteDesktop.slnx --no-build -c Release --report-trx --results-directory TestResults
          if ($LASTEXITCODE -eq 0) { exit 0 }

          $failed = [System.Collections.Generic.List[string]]::new()
          foreach ($file in Get-ChildItem TestResults/*.trx -ErrorAction SilentlyContinue) {
              [xml]$xml = Get-Content $file.FullName
              $xml.TestRun.Results.UnitTestResult |
                  Where-Object { $_.outcome -eq 'Failed' } |
                  ForEach-Object { $failed.Add($_.testName) }
          }

          $names = if ($failed.Count) { $failed -join '; ' } else { '(no TRX recorded a failure)' }
          Write-Host "::warning title=Tests failed on the first attempt (rerunning once)::$names"

          Remove-Item TestResults -Recurse -Force -ErrorAction SilentlyContinue
          dotnet test RemoteDesktop.slnx --no-build -c Release --report-trx --results-directory TestResults
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error title=Tests failed twice::the rerun failed as well, so this is not the runner being flaky."
          }

      # 客户端安装包要不要内置服务器地址，由仓库变量 DEFAULT_RENDEZVOUS_URI 决定
      # （Settings -> Secrets and variables -> Actions -> Variables）。
      #
      # 没配置不是错误，而是选中了"不内置"：本软件公网和内网都要用，服务器地址往往是部署时才定的，一个装在
      # 用户机器上的包内置谁的地址都不对。这样的包默认连它自己那台机器，连不上时客户端界面会直说"未连接服务器
      # （地址）"并告诉用户去哪儿改，所以不会变成"看着正常、就是连不上"。这里的说明会写进 Release。
      - name: Decide the server address and the release note
        shell: pwsh
        run: |
          $address = "${{ vars.DEFAULT_RENDEZVOUS_URI }}"
          if ($address) {
              Write-Host "The client installer will point at $address."
              "DEFAULT_SERVER=$address" >> $env:GITHUB_ENV
              $note = "客户端安装包已内置信令服务器地址 ``$address``：装完直接可用。"
          } else {
              Write-Warning 'No DEFAULT_RENDEZVOUS_URI: the client installer gets no built-in address.'

              # PowerShell 的 here-string 要求结束符顶格，而 YAML 的 run: | 块里每一行都必须缩进——两者不能共存，
              # 所以这里用数组拼（而不是 @"..."@）。
              $note = @(
                  '> [!IMPORTANT]'
                  '> **本安装包没有内置服务器地址**，客户端默认连的是本机。装完后请在客户端里用「修改服务器地址」'
                  '> 填入你自己的服务器（`ws://主机:5080/ws` 或 `wss://域名/ws`）——它会同时写给客户端和被控端服务。'
                  '> 部署步骤见 [docs/deployment.md](https://github.com/gaozeqian/RemoteDesktop/blob/master/docs/deployment.md)。'
              ) -join "`n"
          }

          # 有地址就写清是哪一个，没有就提醒要自己填——两种都是一个句子，所以这个文件总是存在。
          # GitHub 会把它放在自动生成的 release notes 前面。
          Set-Content -Path release-body.md -Value $note -Encoding utf8

      # 可选：如果你需要使用真正的代码签名，而不是自签/跳过，
      # 可以将 PKCS#12 (.pfx) 证书作为 Base64 存在 GitHub Secrets 中，然后在这里解码为文件。
      # 下面演示了如何从 Secrets 获取 PFX 证书并解码：
      - name: Decode Code Signing Certificate (Optional)
        if: env.PFX_BASE64 != ''
        run: |
          $pfxBytes = [System.Convert]::FromBase64String($env:PFX_BASE64)
          [System.IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\sign.pfx", $pfxBytes)

      # 运行构建脚本打包 MSI（客户端 / 被控端）。服务器地址由上一步决定：有就内置，没有就不传
      # -RendezvousUri（脚本保留项目里的默认值，并在日志里给出警告）。
      #
      # 参数用哈希表展开（@{} 按名字绑定）而不是数组展开：@() 是**按位置**传参的，写成
      # @('-Configuration','Release') 会让 '-Configuration' 这个字符串成为第一个位置参数的值，参数名根本不起作用
      # ——第一次跑 v0.2.0 就是这么失败的（目录被建成名为 `-Configuration` 的文件夹，WiX 找不到 SourceRoot）。
      - name: Build MSI Installer
        shell: pwsh
        run: |
          $arguments = @{ Configuration = 'Release' }
          if ($env:DEFAULT_SERVER) { $arguments.RendezvousUri = $env:DEFAULT_SERVER }
          if ($env:PFX_BASE64 -and $env:PFX_PASSWORD) {
              $arguments.CertificateFile = "$env:GITHUB_WORKSPACE\sign.pfx"
              $arguments.CertificatePassword = $env:PFX_PASSWORD
          } else {
              $arguments.SkipSigning = $true
          }

          .\build\installer\client\windows\build-installer.ps1 @arguments

      # 服务端（信令 + 中继）的安装包。和上面那个用同一套签名参数、同一个版本号，但是两个各自独立安装的包：
      # 一台机器可以只做被控端、只做服务器，或者两个都做。
      - name: Build Server MSI Installer
        shell: pwsh
        run: |
          if ($env:PFX_BASE64 -and $env:PFX_PASSWORD) {
              .\build\installer\server\windows\build-server-installer.ps1 -Configuration Release -CertificateFile "$env:GITHUB_WORKSPACE\sign.pfx" -CertificatePassword $env:PFX_PASSWORD
          } else {
              .\build\installer\server\windows\build-server-installer.ps1 -Configuration Release -SkipSigning
          }

      # 将打好的两个 MSI 提取出来
      - name: Rename Artifacts for Release
        shell: pwsh
        run: |
          # 两个包分别在 build/installer/<角色>/windows/artifacts/ 下，各取最新打出的那个 .msi
          $clientFolder = 'build/installer/client/windows/artifacts'
          $serverFolder = 'build/installer/server/windows/artifacts'
          $client = Get-ChildItem -Path $clientFolder/*.msi -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $server = Get-ChildItem -Path $serverFolder/*.msi -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1

          # 少一个就什么都别发：只发出客户端、悄悄少了服务端，是发完才会被发现的那种错。
          if (-not $client) { throw "No client installer in $clientFolder." }
          if (-not $server) { throw "No server installer in $serverFolder." }

          # 根据 GitHub Tag (例如 v1.0.0) 重命名文件，使其更加专业
          $clientName = "RemoteDesktop-Windows-x64-$($env:GITHUB_REF_NAME).msi"
          $serverName = "RemoteDesktop-Server-Windows-x64-$($env:GITHUB_REF_NAME).msi"
          Rename-Item -Path $client.FullName -NewName $clientName
          Rename-Item -Path $server.FullName -NewName $serverName
          Write-Output "CLIENT_MSI=build/installer/client/windows/artifacts/$clientName" >> $env:GITHUB_ENV
          Write-Output "SERVER_MSI=build/installer/server/windows/artifacts/$serverName" >> $env:GITHUB_ENV

      # 取回 build-macos 打好的 .pkg。用 artifact 而不是让 macOS job 自己上传 Release，是为了让"发版"只发生
      # 在这一处——否则 Windows 和 macOS 会各自尝试创建同一个 Release，谁先谁后不定。
      - name: Download the macOS installer
        uses: actions/download-artifact@v7
        with:
          name: macos-installer
          path: macos-installer

      # 上传至 GitHub Release：一个版本一个 Release，三个包都放在里面（装的机器不同，版本是同一个）。
      # body 会被放在自动生成的 release notes 前面，所以"这个包有没有内置地址"永远写在最上面。
      # 用官方 gh CLI 取代第三方 softprops/action-gh-release（上游已停维护）；gh 在托管 runner 上预装，
      # github.token 已有 contents:write 权限。
      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path macos-installer/*.pkg -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pkg) { throw "No macOS installer was downloaded from build-macos." }

          gh release create "$env:GITHUB_REF_NAME" `
            "$env:CLIENT_MSI" "$env:SERVER_MSI" "$($pkg.FullName)" `
            --title "$env:GITHUB_REF_NAME" `
            --notes-file release-body.md `
            --generate-notes

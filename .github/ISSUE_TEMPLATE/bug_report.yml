name: Bug 报告
description: 功能不符合预期、崩溃或连接失败
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞**不要**在这里报，请走 [Security → Report a vulnerability](https://github.com/gaozeqian/RemoteDesktop/security/advisories/new)（见 SECURITY.md）。

        先跑一下自检，它能一次答完大部分环境问题：

        ```bash
        remotedesktop --self-check                                    # 客户端
        /usr/lib/remotedesktop-host/RemoteDesktop.HostService --self-check   # Linux 被控端
        ```

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际看到什么。有报错原文就贴原文，不要只写"报错了"。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望发生什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: which-app
    attributes:
      label: 涉及哪个程序
      description: 客户端、被控端（服务 / Agent）、还是信令与中继服务器
      placeholder: 客户端
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      multiple: true
      options:
        - Windows
        - macOS (Apple Silicon)
        - Linux (Wayland)
        - Linux (X11)
        - 服务端（Docker / 原生）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 安装包版本号，或 `git rev-parse --short HEAD` 的结果
      placeholder: 0.3.0.0 / 4f14524
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: 构建类型
      description: Debug 构建的颜色转换慢约 10 倍，性能问题请先用 Release 构建复现
      options:
        - Release
        - Debug
        - 不确定
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        日志位置：Windows `%ProgramData%\RemoteDesktop\logs`（`service-*.log`、`agent-*.log`），
        Linux `journalctl --user -u remotedesktop-host`。**贴之前删掉设备代码、密码和 IP。**
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我搜过现有 issue，没有重复
          required: true
        - label: 这**不是**安全问题（是的话我走私有通道上报）
          required: true

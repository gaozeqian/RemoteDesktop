// Messages on the control channel of a peer connection (one frame = one envelope).
// Field numbers are on the wire: never renumber, only append.
syntax = "proto3";

package remotedesktop.control;

option csharp_namespace = "RemoteDesktop.Protocol.Control";

message ControlMessage {
  oneof body {
    Hello hello = 1;
    AuthChallenge auth_challenge = 2;
    AuthResponse auth_response = 3;
    AuthResult auth_result = 4;
    Ping ping = 5;
    Pong pong = 6;
    GrantChanged grant_changed = 7;
    InputAccessChanged input_access_changed = 8;
    RequestInputAccess request_input_access = 9;
  }
}

enum SessionModeMessage {
  SESSION_MODE_CONTROL = 0;
  SESSION_MODE_VIEW = 1;
}

// Controller -> host, first message of a session.
message Hello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  SessionModeMessage mode = 3;
  // RemoteDesktop.Domain.Permissions flags.
  uint32 requested_permissions = 4;
  // The controller's id for this session (32 hex chars). The host adopts it so both ends report telemetry under one
  // id and the console keeps one row per session instead of two. Empty from a client that has none; the host then
  // mints its own.
  string session_id = 5;
}

// Host -> controller.
message AuthChallenge {
  bytes nonce = 1;
  uint32 protocol_major = 2;
  uint32 protocol_minor = 3;
}

// Controller -> host: HMAC over the nonce and both certificate fingerprints (see PasswordProof).
message AuthResponse {
  bytes proof = 1;
}

enum AuthFailure {
  AUTH_FAILURE_NONE = 0;
  AUTH_FAILURE_BAD_PASSWORD = 1;
  AUTH_FAILURE_TOO_MANY_ATTEMPTS = 2;
  AUTH_FAILURE_INCOMPATIBLE_VERSION = 3;
}

// Host -> controller.
message AuthResult {
  bool accepted = 1;
  AuthFailure failure = 2;
  SessionModeMessage mode = 3;
  uint32 granted_permissions = 4;
}

message Ping {
  int64 timestamp = 1;
}

message Pong {
  int64 timestamp = 1;
}

// Host -> controller when the host changes what this controller may do during the session (e.g. switches it to
// watch-only). The controller must stop offering what is no longer allowed; the host enforces it regardless.
message GrantChanged {
  SessionModeMessage mode = 1;
  uint32 granted_permissions = 2;
}

enum InputAccessStateMessage {
  INPUT_ACCESS_UNKNOWN = 0;
  // No separate grant exists on the host platform; the session grant is the whole answer.
  INPUT_ACCESS_NOT_APPLICABLE = 1;
  // The operating system has not been asked yet; on Wayland it asks on the first input.
  INPUT_ACCESS_NOT_REQUESTED = 2;
  // The host is showing, or about to show, the system permission question.
  INPUT_ACCESS_REQUESTING = 3;
  INPUT_ACCESS_GRANTED = 4;
  INPUT_ACCESS_DENIED = 5;
  // The injection mechanism itself is unavailable (portal, session bus or libei).
  INPUT_ACCESS_UNAVAILABLE = 6;
}

// Host -> controller whenever the operating system's permission for input changes. A controller shows a banner and
// stops capturing input while the state is DENIED or UNAVAILABLE; GRANTED restores it. The session grant remains a
// separate question: it says whether the host's policy allows control at all.
message InputAccessChanged {
  InputAccessStateMessage state = 1;
  string reason = 2;
  // Monotonic across every send to one controller, so a status that was in flight while a session started cannot
  // overwrite a newer one. A receiver ignores anything not greater than the last sequence it applied.
  uint64 sequence = 3;
}

// Controller -> host: ask the desktop again, ignoring the backoff a refusal left behind. The host answers with
// InputAccessChanged (possibly REQUESTING first) for every controller that may control.
message RequestInputAccess {
}
